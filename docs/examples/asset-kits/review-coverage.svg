<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">Individual review coverage across two corpus editions</title><desc id="desc">Version 1.4.0: 89 reviewed and 116 unreviewed patterns. Version 1.5.0: 93 reviewed and 116 unreviewed. This is not search performance.</desc><rect width="760" height="320" fill="#fffaf0"/><g font-family="sans-serif" fill="#17251d"><text x="28" y="40" font-size="24">What has actually been reviewed?</text><text x="28" y="70" font-size="15">Pattern counts · each block segment uses the same scale</text><text x="28" y="130" font-size="18">1.4.0</text><rect x="110" y="100" width="178" height="46" fill="#176b48"/><rect x="288" y="100" width="232" height="46" fill="#e4d9bf"/><text x="122" y="130" fill="white" font-size="18">89 reviewed</text><text x="300" y="130" font-size="18">116 unreviewed</text><text x="540" y="130" font-size="18">205 total</text><text x="28" y="200" font-size="18">1.5.0</text><rect x="110" y="170" width="186" height="46" fill="#176b48"/><rect x="296" y="170" width="232" height="46" fill="#e4d9bf"/><text x="122" y="200" fill="white" font-size="18">93 reviewed</text><text x="308" y="200" font-size="18">116 unreviewed</text><text x="540" y="200" font-size="18">209 total</text><text x="28" y="264" font-size="16">Source: versioned Cite Goose corpus · 8 September 2026</text><text x="28" y="292" font-size="16">Review coverage is not ranking, adoption or revenue evidence.</text></g></svg>
