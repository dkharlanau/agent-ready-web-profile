name: Validate Agent-Ready Web Profile
description: Validate an ARWP site-profile.json in CI with the versioned schema and semantic checks.
author: Dzmitryi Kharlanau

inputs:
  profile:
    description: Path to the ARWP JSON profile in the caller repository.
    required: false
    default: ai/site-profile.json

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install pinned ARWP runtime
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --omit=dev --ignore-scripts --no-audit --no-fund

    - name: Validate ARWP profile
      shell: bash
      run: node "$GITHUB_ACTION_PATH/bin/arwp.mjs" validate "${{ inputs.profile }}"

branding:
  icon: check-circle
  color: blue
