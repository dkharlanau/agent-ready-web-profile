name: Search appearance checks

on:
  push:
    branches: [main]
    paths:
      - 'lib/search-appearance.mjs'
      - 'lib/search-appearance-patch.mjs'
      - 'bin/arwp-search-appearance.mjs'
      - 'bin/arwp-search-appearance-patch.mjs'
      - 'schema/search-appearance-patch-manifest.schema.json'
      - 'scripts/search-appearance-test.mjs'
      - 'scripts/search-appearance-patch-test.mjs'
      - 'docs/SEARCH-APPEARANCE.md'
      - 'skills/arwp-growth-loop/SKILL.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/search-appearance.yml'
  pull_request:
    paths:
      - 'lib/search-appearance.mjs'
      - 'lib/search-appearance-patch.mjs'
      - 'bin/arwp-search-appearance.mjs'
      - 'bin/arwp-search-appearance-patch.mjs'
      - 'schema/search-appearance-patch-manifest.schema.json'
      - 'scripts/search-appearance-test.mjs'
      - 'scripts/search-appearance-patch-test.mjs'
      - 'docs/SEARCH-APPEARANCE.md'
      - 'skills/arwp-growth-loop/SKILL.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/search-appearance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-appearance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and deterministic offline fixtures
        run: |
          node --check lib/search-appearance.mjs
          node --check lib/search-appearance-patch.mjs
          node --check bin/arwp-search-appearance.mjs
          node --check bin/arwp-search-appearance-patch.mjs
          node --check scripts/search-appearance-test.mjs
          node --check scripts/search-appearance-patch-test.mjs
          node scripts/search-appearance-test.mjs
          node scripts/search-appearance-patch-test.mjs
      - name: Verify CLIs are shipped and runnable from the package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/appearance-pack.json"
          TARBALL=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/appearance-pack.json")
          mkdir -p "$RUNNER_TEMP/appearance-package"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/appearance-package"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/appearance-package/package" >/dev/null
          node "$RUNNER_TEMP/appearance-package/package/bin/arwp-search-appearance.mjs" --help
          node "$RUNNER_TEMP/appearance-package/package/bin/arwp-search-appearance-patch.mjs" --help
