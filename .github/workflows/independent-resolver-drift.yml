name: Independent resolver drift

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/independent-resolver-drift.yml'
      - 'benchmarks/drift-corpus.config.json'
      - 'monitor/**'
      - 'lib/resolver*.mjs'
      - 'lib/scanner.mjs'
      - 'lib/http-discovery.mjs'
      - 'lib/public-fetch.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: independent-resolver-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore previous independent snapshots
        uses: actions/cache@v4
        with:
          path: .arwp-independent-drift/snapshots
          key: ${{ runner.os }}-arwp-independent-drift-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-arwp-independent-drift-

      - name: Run independent resolver monitor
        id: monitor
        shell: bash
        run: |
          set +e
          mkdir -p .arwp-independent-drift
          node monitor/runner.mjs \
            --config=benchmarks/drift-corpus.config.json \
            --snapshot-dir=.arwp-independent-drift/snapshots \
            --evidence-dir=.arwp-independent-drift/evidence \
            --report=.arwp-independent-drift/report.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish compact observation summary
        if: always()
        shell: bash
        run: |
          echo '### Independent ARWP resolver drift observation' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reviewed engineering corpus only; this workflow is not an adoption or registry signal.' >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f .arwp-independent-drift/report.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No monitor report was produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('.arwp-independent-drift/report.json', 'utf8'));
          console.log('');
          console.log(`Observed sites: ${report.sites?.length ?? 0}`);
          const counts = new Map();
          for (const site of report.sites || []) counts.set(site.status, (counts.get(site.status) || 0) + 1);
          for (const [status, count] of [...counts].sort()) console.log(`- ${status}: ${count}`);
          console.log(`- drift evidence bundles: ${report.summary?.evidenceWritten ?? 0}`);
          console.log('');
          console.log(report.notification?.text || 'No compact notification was produced.');
          for (const site of report.notification?.sites || []) {
            const classes = site.classes?.length ? ` — ${site.classes.join(', ')}` : '';
            console.log(`- \`${site.id}\`: ${site.status}${classes}`);
          }
          NODE

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arwp-independent-drift-${{ github.run_id }}
          path: |
            .arwp-independent-drift/report.json
            .arwp-independent-drift/snapshots/*.json
            .arwp-independent-drift/evidence/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail only on configured monitor conditions
        if: steps.monitor.outputs.status != '0'
        run: |
          echo 'Independent resolver monitor hit a configured failure condition. Inspect the summary and artifact.'
          exit 1
