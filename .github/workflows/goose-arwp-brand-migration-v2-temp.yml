name: Goose ARWP Brand Migration V2 Temporary

on:
  push:
    branches: [brand/goose-arwp-get-found-2026-09-09]
    paths:
      - '.github/workflows/goose-arwp-brand-migration-v2-temp.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply Goose ARWP / Get Found identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = file => fs.readFileSync(file, 'utf8');
          const write = (file, text) => fs.writeFileSync(file, text);
          const replace = (file, from, to, required = true) => {
            const before = read(file);
            if (required && !before.includes(from)) throw new Error(`${file}: expected text not found: ${from}`);
            const after = before.replaceAll(from, to);
            if (after !== before) write(file, after);
          };
          const updateJson = (file, fn) => {
            const value = JSON.parse(read(file));
            fn(value);
            write(file, JSON.stringify(value, null, 2) + '\n');
          };

          replace('README.md', '# Goose\n\n**Make your site worth citing.**', '# Goose ARWP\n\n**Get Found.**');
          replace('README.md', 'Goose is the product-facing layer of **Agent-Ready Web Profile (ARWP)**', 'Goose ARWP is the product-facing layer built on **Agent-Ready Web Profile (ARWP)**');
          replace('README.md', 'Canonical product name: **Goose**. **Agent-Ready Web Profile** and **ARWP** remain technical aliases.', 'Canonical product name: **Goose ARWP**. **Goose** is the short form; **Agent-Ready Web Profile** is the technical foundation and **ARWP** remains its established abbreviation.');

          const brand = read('docs/BRAND-GOOSE.md');
          const brandPrefix = '# Goose visual identity\n\nIdentity revision 1.1 — 2026-09-08.\n\n**Goose** is the product-facing name. **Agent-Ready Web Profile** and **ARWP** remain technical aliases; package names, CLI commands, canonical URLs and entity IDs retain their existing identity. No registered or cleared trademark status is asserted.\n\nThe primary line is **“Make your site worth citing.”** It expresses the product\'s aim. Use measured results to describe actual discovery outcomes.';
          const brandNext = '# Goose ARWP visual identity\n\nIdentity revision 1.2 — 2026-09-09.\n\n**Goose ARWP** is the canonical product-facing name. **Goose** is the short form used in conversational copy and module names. **Agent-Ready Web Profile** remains the technical foundation, and **ARWP** remains its established technical abbreviation; package names, CLI commands, canonical URLs and entity IDs retain their existing identity. No registered or cleared trademark status is asserted.\n\nThe preferred display lockup is **“Goose ARWP — Get Found.”** The primary tagline is **“Get Found.”** It states the user goal without promising rankings, citations or traffic. Use measured results to describe actual discovery outcomes.';
          if (!brand.includes(brandPrefix)) throw new Error('docs/BRAND-GOOSE.md: identity prefix drifted');
          write('docs/BRAND-GOOSE.md', brand.replace(brandPrefix, brandNext));

          replace('docs/BRAND-CITE-GOOSE.md', 'The current public product brand is **Goose**. The technical core remains **Agent-Ready Web Profile (ARWP)**.', 'The current public product brand is **Goose ARWP**; **Goose** is its short form. The technical core remains **Agent-Ready Web Profile (ARWP)**.');
          replace('TRADEMARKS.md', 'Policy date: 2026-09-08.', 'Policy date: 2026-09-09.');
          replace('TRADEMARKS.md', 'The public product name is **Goose**. **Agent-Ready Web Profile** and **ARWP** remain its technical project names and aliases; repository, package, CLI and canonical identifiers retain their existing names.', 'The public product name is **Goose ARWP**. **Goose** is the short form. **Agent-Ready Web Profile** remains the technical project name and **ARWP** its established abbreviation; repository, package, CLI and canonical identifiers retain their existing names.');

          updateJson('registry/product-line.json', value => {
            value.reviewedAt = '2026-09-09';
            value.brand = 'Goose ARWP';
            value.brandAliases = ['Goose', 'Agent-Ready Web Profile', 'ARWP'];
            value.brandNameReviewedAt = '2026-09-09';
            value.tagline = 'Get Found.';
          });

          updateJson('ai/site-profile.json', value => {
            value.name = 'Goose ARWP';
            value.description = value.description.replace('Goose is the product brand of Agent-Ready Web Profile (ARWP):', 'Goose ARWP is the product-facing brand built on Agent-Ready Web Profile (ARWP):');
            const first = value.data?.distributions?.[0];
            if (first?.name === 'Goose discoverability implementation corpus') first.name = 'Goose ARWP discoverability implementation corpus';
          });
          fs.copyFileSync('ai/site-profile.json', 'docs/ai/site-profile.json');

          updateJson('registry/product-classification.json', value => {
            if (value.project) {
              value.project.name = 'Goose ARWP';
              value.project.aliases = ['Goose', 'Agent-Ready Web Profile', 'ARWP'];
            }
          });
          fs.copyFileSync('registry/product-classification.json', 'docs/ai/product-classification.json');

          updateJson('docs/ai/product.jsonld', value => {
            const software = (value['@graph'] || []).find(item => item['@id'] === 'https://dkharlanau.github.io/agent-ready-web-profile/#software');
            if (!software) throw new Error('docs/ai/product.jsonld: software entity not found');
            software.name = 'Goose ARWP';
            software.alternateName = ['Goose', 'Agent-Ready Web Profile', 'ARWP'];
          });

          updateJson('docs/media/press-facts.json', value => {
            value.lastReviewed = '2026-09-09';
            value.project.name = 'Goose ARWP';
            value.project.aliases = ['Goose', 'Agent-Ready Web Profile', 'ARWP'];
            value.project.brandNameReviewedAt = '2026-09-09';
            value.project.shortName = 'Goose';
            value.project.oneLine = 'Goose ARWP (Agent-Ready Web Profile) is an open-source interoperability resolver for discovering and normalizing the web, data, API and agent-facing interfaces a public website exposes.';
            value.project.boilerplate = value.project.boilerplate.replace('Goose is the product brand of Agent-Ready Web Profile (ARWP),', 'Goose ARWP is the product-facing brand built on Agent-Ready Web Profile (ARWP),');
            value.preferredAttribution = 'Source: Goose ARWP (Agent-Ready Web Profile / ARWP) — https://dkharlanau.github.io/agent-ready-web-profile/';
          });

          updateJson('docs/evidence-lab/index.json', value => { value.product = 'Goose ARWP'; });

          replace('docs/index.html', 'Goose helps focused websites become easier to discover, understand and cite:', 'Goose ARWP helps focused websites become easier to discover, understand and cite:');
          replace('docs/index.html', 'Goose — Make your site worth citing.', 'Goose ARWP — Get Found.');
          replace('docs/index.html', '<h1>Make your site<br>worth citing.</h1>', '<h1>Get<br>Found.</h1>');
          replace('docs/index.html', '<strong>Goose</strong><span>AGENT-READY<br>WEB PROFILE</span>', '<strong>Goose</strong><span>ARWP<br>GET FOUND.</span>');
          replace('docs/index.html', '"name": "Goose",\n        "alternateName": ["Agent-Ready Web Profile", "ARWP"]', '"name": "Goose ARWP",\n        "alternateName": ["Goose", "Agent-Ready Web Profile", "ARWP"]');

          replace('docs/site-focus.html', '<strong>Goose</strong><span>AGENT-READY<br>WEB PROFILE</span>', '<strong>Goose</strong><span>ARWP<br>GET FOUND.</span>');
          replace('docs/evidence-lab/index.html', '<strong>Goose</strong><span>AGENT-READY<br>WEB PROFILE</span>', '<strong>Goose</strong><span>ARWP<br>GET FOUND.</span>');

          replace('docs/trust/brand.html', '<title>Project name, brand references and trademark status — Goose</title>', '<title>Project name, brand references and trademark status — Goose ARWP</title>');
          replace('docs/trust/brand.html', 'How to identify Goose and its Agent-Ready Web Profile / ARWP technical aliases', 'How to identify Goose ARWP, its Goose short form and Agent-Ready Web Profile / ARWP technical identity');
          replace('docs/trust/brand.html', 'Goose is the public product brand, maintained by Dzmitryi Kharlanau. Agent-Ready Web Profile and ARWP remain its technical project names and aliases.', 'Goose ARWP is the public product brand, maintained by Dzmitryi Kharlanau; Goose is the short form. Agent-Ready Web Profile remains the technical project name and ARWP its established abbreviation.');

          replace('scripts/build-discoverability.mjs', "name: 'Goose — Discoverability Pattern Library'", "name: 'Goose ARWP — Discoverability Pattern Library'");
          replace('scripts/build-discoverability.mjs', '<title>Goose — ${corpus.tactics.length} source-backed website patterns</title>', '<title>Goose ARWP — ${corpus.tactics.length} source-backed website patterns</title>');
          replace('scripts/build-discoverability.mjs', 'content="Make your site worth citing. Choose from ${corpus.tactics.length}', 'content="Get Found. Choose from ${corpus.tactics.length}');
          replace('scripts/build-discoverability.mjs', 'content="Goose — Make your site worth citing."', 'content="Goose ARWP — Get Found."');
          replace('scripts/build-discoverability.mjs', '<strong>Goose</strong><span>AGENT-READY<br>WEB PROFILE</span>', '<strong>Goose</strong><span>ARWP<br>GET FOUND.</span>');
          replace('scripts/build-discoverability.mjs', '<h1>Make your site<br>worth citing.</h1>', '<h1>Get<br>Found.</h1>');
          replace('scripts/build-discoverability.mjs', '<footer class="goose-footer goose-shell"><a class="goose-brand" href="./"><strong>Goose</strong></a>', '<footer class="goose-footer goose-shell"><a class="goose-brand" href="./"><strong>Goose</strong><span>ARWP<br>GET FOUND.</span></a>');

          replace('scripts/site-test.mjs', '/<h1>Make your site<br>worth citing\\.<\\/h1>/i', '/<h1>Get<br>Found\\.<\\/h1>/i');
          replace('scripts/evidence-lab-test.mjs', "assert.equal(lab.product, 'Goose');", "assert.equal(lab.product, 'Goose ARWP');");
          NODE
          node scripts/build-discoverability.mjs
          node scripts/goose-brand-test.mjs
          node scripts/site-test.mjs
          node scripts/evidence-lab-test.mjs
          node -e "JSON.parse(require('fs').readFileSync('registry/product-line.json','utf8')); JSON.parse(require('fs').readFileSync('ai/site-profile.json','utf8')); JSON.parse(require('fs').readFileSync('docs/ai/site-profile.json','utf8')); JSON.parse(require('fs').readFileSync('docs/ai/product.jsonld','utf8')); JSON.parse(require('fs').readFileSync('docs/media/press-facts.json','utf8'));"
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No brand changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TRADEMARKS.md docs registry ai scripts
          git commit -m "brand: adopt Goose ARWP — Get Found"
          git push origin "HEAD:${GITHUB_REF_NAME}"
