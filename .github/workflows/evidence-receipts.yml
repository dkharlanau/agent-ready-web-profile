name: Evidence receipt integrity

on:
  push:
    branches: [main]
    paths:
      - 'lib/evidence-receipt.mjs'
      - 'bin/arwp-receipt.mjs'
      - 'schema/evidence-receipt.schema.json'
      - 'scripts/evidence-receipt-test.mjs'
      - 'scripts/evidence-receipt-cli-test.mjs'
      - 'docs/EVIDENCE-RECEIPTS.md'
      - '.github/workflows/evidence-receipts.yml'
  pull_request:
    paths:
      - 'lib/evidence-receipt.mjs'
      - 'bin/arwp-receipt.mjs'
      - 'schema/evidence-receipt.schema.json'
      - 'scripts/evidence-receipt-test.mjs'
      - 'scripts/evidence-receipt-cli-test.mjs'
      - 'docs/EVIDENCE-RECEIPTS.md'
      - '.github/workflows/evidence-receipts.yml'

permissions:
  contents: read

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate receipt model and schema
        run: |
          node scripts/evidence-receipt-test.mjs
          node --check lib/evidence-receipt.mjs
          node --check scripts/evidence-receipt-test.mjs
      - name: Validate receipt CLI
        run: |
          node scripts/evidence-receipt-cli-test.mjs
          node --check bin/arwp-receipt.mjs
          node --check scripts/evidence-receipt-cli-test.mjs
