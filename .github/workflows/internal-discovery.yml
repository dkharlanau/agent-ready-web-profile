name: Internal discovery evidence

on:
  push:
    branches: [main]
    paths:
      - 'lib/internal-discovery.mjs'
      - 'bin/arwp-internal-discovery.mjs'
      - 'schema/internal-discovery-report.schema.json'
      - 'scripts/internal-discovery-test.mjs'
      - 'docs/INTERNAL-DISCOVERY-EVIDENCE.md'
      - 'lib/site-gate.mjs'
      - 'lib/public-fetch.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/internal-discovery.yml'
  pull_request:
    paths:
      - 'lib/internal-discovery.mjs'
      - 'bin/arwp-internal-discovery.mjs'
      - 'schema/internal-discovery-report.schema.json'
      - 'scripts/internal-discovery-test.mjs'
      - 'docs/INTERNAL-DISCOVERY-EVIDENCE.md'
      - 'lib/site-gate.mjs'
      - 'lib/public-fetch.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/internal-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate bounded graph contract
        run: |
          node --check lib/internal-discovery.mjs
          node --check bin/arwp-internal-discovery.mjs
          node --check scripts/internal-discovery-test.mjs
          node -e "JSON.parse(require('fs').readFileSync('schema/internal-discovery-report.schema.json','utf8'))"
          node scripts/internal-discovery-test.mjs
          node bin/arwp-internal-discovery.mjs --help
      - name: Reject score-like regressions in the public contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const schema = JSON.parse(fs.readFileSync('schema/internal-discovery-report.schema.json', 'utf8'));
          for (const key of ['noCompositeScore','noPageRankApproximation','noRankingPromise','unknownRemainsUnknown','linkCountNotCausality']) {
            if (schema.properties.guardrails.properties[key]?.const !== true) throw new Error(`missing guardrail: ${key}`);
          }
          NODE
