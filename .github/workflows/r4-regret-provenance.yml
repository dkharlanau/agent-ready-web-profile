name: R4 regret provenance

on:
  push:
    branches:
      - r4-resolver-dominance
    paths:
      - .github/workflows/r4-regret-provenance.yml

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4-resolver-dominance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unchanged external corpus and diagnostics
        run: |
          npm run benchmark:external -- --output=/tmp/external.json
          node benchmarks/publication-report.mjs --input=/tmp/external.json --output=/tmp/external-public.json
          node benchmarks/selection-diagnostics.mjs --input=/tmp/external-public.json --output=/tmp/diagnostics.json
      - name: Write sanitized provenance facts for regret cases
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/external-public.json', 'utf8'));
          const diagnostics = JSON.parse(fs.readFileSync('/tmp/diagnostics.json', 'utf8'));
          const siteById = new Map(report.results.map(site => [site.id, site]));
          const issueByKey = new Map(diagnostics.issues.map(item => [`${item.siteId}:${item.intent}`, item]));
          const rows = diagnostics.regretCases.map(item => {
            const issue = issueByKey.get(`${item.siteId}:${item.intent}`) || {};
            const site = siteById.get(item.siteId) || {};
            const selected = issue.selected || {};
            let targetHost = null;
            let selectedHost = null;
            try { targetHost = new URL(site.url).host; } catch {}
            try { selectedHost = new URL(selected.url).host; } catch {}
            return {
              site_id: item.siteId,
              intent: item.intent,
              category: issue.category || null,
              classification: issue.classification || null,
              target_host: targetHost,
              selected_host: selectedHost,
              same_origin_host: Boolean(targetHost && selectedHost && targetHost === selectedHost),
              selected_protocol: selected.protocol || null,
              selected_kind: selected.kind || null,
              selected_source_id: selected.sourceId || null,
              selected_discovery_scope: selected.discoveryScope || null,
              selected_source_authority: selected.sourceAuthority || null,
              simpler_strategies_correct: item.simplerStrategies
            };
          }).sort((a, b) => a.site_id.localeCompare(b.site_id) || a.intent.localeCompare(b.intent));
          const payload = {
            date: '2026-08-28',
            policy: 'Sanitized provenance-only diagnostics. No endpoint paths/query strings, accepted routes, card payloads, or ground-truth changes.',
            cases: rows
          };
          fs.writeFileSync('benchmarks/results/2026-08-28-r4-regret-provenance.json', `${JSON.stringify(payload, null, 2)}\n`);
          console.log(JSON.stringify(payload, null, 2));
          NODE
      - name: Commit provenance inventory only
        run: |
          rm .github/workflows/r4-regret-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: inspect provenance of measured resolver regret"
          git push origin HEAD:r4-resolver-dominance
