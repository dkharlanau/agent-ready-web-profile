name: One-time license metadata cleanup

on:
  push:
    paths:
      - .github/workflows/license-metadata-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align current public license metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def update_json(path, fn):
              p = Path(path)
              if not p.exists():
                  return
              data = json.loads(p.read_text(encoding='utf-8'))
              fn(data)
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def product_license(data):
              if isinstance(data.get('project'), dict):
                  data['project']['license'] = 'PolyForm-Strict-1.0.0'

          update_json('registry/product-classification.json', product_license)
          update_json('docs/ai/product-classification.json', product_license)

          def press_facts(data):
              software = data.get('licenses', {}).get('software')
              if isinstance(software, dict):
                  software['name'] = 'PolyForm Strict License 1.0.0'
                  software['spdx'] = 'PolyForm-Strict-1.0.0'
                  software['url'] = 'https://polyformproject.org/licenses/strict/1.0.0'
          update_json('docs/media/press-facts.json', press_facts)

          def trust(data):
              reuse = data.get('reuse')
              if isinstance(reuse, dict):
                  reuse['software'] = 'PolyForm-Strict-1.0.0'
          update_json('docs/trust/trust.json', trust)

          replacements = {
              'software remains Apache-2.0': 'current software is licensed under PolyForm Strict 1.0.0; earlier Apache-2.0 revision grants remain valid',
              'Software remains Apache-2.0': 'Current software is licensed under PolyForm Strict 1.0.0; earlier Apache-2.0 revision grants remain valid',
              'software source code, which remains licensed under Apache-2.0': 'current software source code, licensed under PolyForm Strict 1.0.0 (earlier Apache-2.0 revision grants remain valid)',
              'software source code, which remains Apache-2.0': 'current software source code, licensed under PolyForm Strict 1.0.0 (earlier Apache-2.0 revision grants remain valid)',
              'License: Apache-2.0': 'License: PolyForm Strict 1.0.0',
          }
          text_paths = [
              'content/pages/product.md',
              'TRADEMARKS.md',
              'docs/trust/brand.html',
              'docs/trust/index.html',
              'docs/product/index.html',
              'docs/media/index.html',
              'docs/index.html',
              'docs/media/rights.json',
          ]
          for path in text_paths:
              p = Path(path)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/license-metadata-cleanup-once.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Verify current license declarations
        shell: bash
        run: |
          grep -q 'PolyForm-Strict-1.0.0' registry/product-classification.json
          grep -q 'PolyForm-Strict-1.0.0' docs/ai/product-classification.json
          grep -q 'PolyForm-Strict-1.0.0' docs/media/press-facts.json
          grep -q 'PolyForm-Strict-1.0.0' docs/trust/trust.json

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m '[skip ci] Align ARWP public license metadata'
          git push
