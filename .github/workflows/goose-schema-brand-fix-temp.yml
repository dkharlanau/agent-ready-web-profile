name: Goose Schema Brand Fix Temporary

on:
  push:
    branches: [brand/goose-cleanup-2026-09-09]
    paths:
      - '.github/workflows/goose-schema-brand-fix-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Replace legacy product name in current schemas
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'schema';
          const changed = [];
          for (const name of fs.readdirSync(root)) {
            const file = path.join(root, name);
            if (!name.endsWith('.json') || !fs.statSync(file).isFile()) continue;
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replaceAll('CITE GOOSE', 'GOOSE').replaceAll('Cite Goose', 'Goose');
            if (after !== before) {
              JSON.parse(after);
              fs.writeFileSync(file, after);
              changed.push(file);
            }
          }
          console.log(`Updated ${changed.length} schema file(s)`);
          for (const file of changed) console.log(`- ${file}`);
          NODE
          node scripts/goose-brand-test.mjs
      - name: Commit schema brand fix
        run: |
          if git diff --quiet; then
            echo "No schema brand changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schema
          git commit -m "chore(brand): align current schema titles with Goose"
          git push origin "HEAD:${GITHUB_REF_NAME}"
