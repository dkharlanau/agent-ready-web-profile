name: SignalBraid Transformation Packs

on:
  push:
    branches: [main]
    paths:
      - 'schema/transformation-pack-registry.schema.json'
      - 'registry/transformation-packs.json'
      - 'lib/transformation-pack.mjs'
      - 'bin/arwp-transform-pack.mjs'
      - 'scripts/transformation-pack-test.mjs'
      - 'docs/TRANSFORMATION-PACKS.md'
      - 'lib/transformation-engine.mjs'
      - 'lib/repository-mapper.mjs'
      - 'schema/transformation-bundle.schema.json'
      - 'schema/site-state-graph.schema.json'
      - 'package.json'
      - '.github/workflows/transformation-packs.yml'
  pull_request:
    paths:
      - 'schema/transformation-pack-registry.schema.json'
      - 'registry/transformation-packs.json'
      - 'lib/transformation-pack.mjs'
      - 'bin/arwp-transform-pack.mjs'
      - 'scripts/transformation-pack-test.mjs'
      - 'docs/TRANSFORMATION-PACKS.md'
      - 'lib/transformation-engine.mjs'
      - 'lib/repository-mapper.mjs'
      - 'schema/transformation-bundle.schema.json'
      - 'schema/site-state-graph.schema.json'
      - 'package.json'
      - '.github/workflows/transformation-packs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Transformation Packs
        run: |
          node scripts/transformation-pack-test.mjs
          node --check lib/transformation-pack.mjs
          node --check bin/arwp-transform-pack.mjs
          node -e "for (const file of ['schema/transformation-pack-registry.schema.json','registry/transformation-packs.json']) JSON.parse(require('fs').readFileSync(file,'utf8'));"
          node bin/arwp-transform-pack.mjs validate | grep -q '"valid": true'
          node bin/arwp-transform-pack.mjs list --adapter=static-html | grep -q 'static-html-core-v0.1'
          node bin/arwp-transform-pack.mjs list --adapter=jekyll | grep -q 'jekyll-core-v0.1'

      - name: Verify npm package surface
        run: |
          npm pack --dry-run --json > /tmp/arwp-pack.json
          node - <<'NODE'
          const report = JSON.parse(require('fs').readFileSync('/tmp/arwp-pack.json', 'utf8'))[0];
          const files = new Set(report.files.map(item => item.path));
          for (const required of [
            'schema/transformation-pack-registry.schema.json',
            'registry/transformation-packs.json',
            'lib/transformation-pack.mjs',
            'bin/arwp-transform-pack.mjs',
            'docs/TRANSFORMATION-PACKS.md'
          ]) {
            if (!files.has(required)) throw new Error(`npm package is missing ${required}`);
          }
          NODE
