name: Search Maturity Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'lib/search-maturity.mjs'
      - 'lib/search-maturity-adaptive-bridge.mjs'
      - 'lib/search-intervention.mjs'
      - 'lib/adaptive-upgrade.mjs'
      - 'registry/adaptive-upgrade-packs.json'
      - 'bin/arwp-search-maturity.mjs'
      - 'bin/arwp-search-intervention.mjs'
      - 'schema/search-maturity-corpus.schema.json'
      - 'schema/search-intervention.schema.json'
      - 'benchmarks/search-maturity/**'
      - 'benchmarks/search-intervention/**'
      - 'benchmarks/search-maturity-test.mjs'
      - 'benchmarks/search-maturity-adaptive-bridge-test.mjs'
      - 'benchmarks/search-intervention-test.mjs'
      - 'benchmarks/search-intervention-arwp-test.mjs'
      - 'docs/SEARCH-MATURITY-BENCHMARK.md'
      - 'docs/SEARCH-MATURITY-DOGFOOD.md'
      - 'docs/SEARCH-INTERVENTION-LEDGER.md'
      - 'skills/arwp-search-maturity/**'
      - '.github/workflows/search-maturity.yml'
  pull_request:
    paths:
      - 'lib/search-maturity.mjs'
      - 'lib/search-maturity-adaptive-bridge.mjs'
      - 'lib/search-intervention.mjs'
      - 'lib/adaptive-upgrade.mjs'
      - 'registry/adaptive-upgrade-packs.json'
      - 'bin/arwp-search-maturity.mjs'
      - 'bin/arwp-search-intervention.mjs'
      - 'schema/search-maturity-corpus.schema.json'
      - 'schema/search-intervention.schema.json'
      - 'benchmarks/search-maturity/**'
      - 'benchmarks/search-intervention/**'
      - 'benchmarks/search-maturity-test.mjs'
      - 'benchmarks/search-maturity-adaptive-bridge-test.mjs'
      - 'benchmarks/search-intervention-test.mjs'
      - 'benchmarks/search-intervention-arwp-test.mjs'
      - 'docs/SEARCH-MATURITY-BENCHMARK.md'
      - 'docs/SEARCH-MATURITY-DOGFOOD.md'
      - 'docs/SEARCH-INTERVENTION-LEDGER.md'
      - 'skills/arwp-search-maturity/**'
      - '.github/workflows/search-maturity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and syntax checks
        run: |
          node benchmarks/search-maturity-test.mjs
          node benchmarks/search-maturity-adaptive-bridge-test.mjs
          node benchmarks/search-intervention-test.mjs
          node benchmarks/search-intervention-arwp-test.mjs
          node --check lib/search-maturity.mjs
          node --check lib/search-maturity-adaptive-bridge.mjs
          node --check lib/search-intervention.mjs
          node --check bin/arwp-search-maturity.mjs
          node --check bin/arwp-search-intervention.mjs
          node --check benchmarks/search-maturity-test.mjs
          node --check benchmarks/search-maturity-adaptive-bridge-test.mjs
          node --check benchmarks/search-intervention-test.mjs
          node --check benchmarks/search-intervention-arwp-test.mjs
      - name: Validate pilot corpus
        run: |
          node bin/arwp-search-maturity.mjs check benchmarks/search-maturity/pilot-2026-09-07.json
          node bin/arwp-search-maturity.mjs cohort benchmarks/search-maturity/pilot-2026-09-07.json --intent=ai-search-optimization --output=/tmp/search-maturity-cohort.json
          test -s /tmp/search-maturity-cohort.json
      - name: Validate intervention records
        run: |
          node bin/arwp-search-intervention.mjs check benchmarks/search-intervention/example-public-safe.json
          node bin/arwp-search-intervention.mjs check benchmarks/search-intervention/arwp-ai-search-visibility-2026-09-07.json
      - name: Guard rank provenance
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const corpus = JSON.parse(fs.readFileSync('benchmarks/search-maturity/pilot-2026-09-07.json', 'utf8'));
          for (const observation of corpus.observations) {
            const surface = observation.observationSurface || {};
            if (surface.rank != null && !surface.rankEvidence) {
              throw new Error(`${observation.id}: rank exists without rankEvidence`);
            }
          }
          console.log('PASS rank provenance guard');
          EOF
