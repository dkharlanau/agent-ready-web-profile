name: Goose Evidence Learning

on:
  push:
    branches: [main]
    paths:
      - 'schema/winner-observation.schema.json'
      - 'schema/recommendation-review-events.schema.json'
      - 'schema/controlled-cohort.schema.json'
      - 'lib/winner-observatory.mjs'
      - 'lib/recommendation-review.mjs'
      - 'lib/controlled-cohort.mjs'
      - 'lib/cohort-search-observation.mjs'
      - 'lib/cohort-index-observation.mjs'
      - 'lib/cohort-index-comparison.mjs'
      - 'lib/cohort-web-observer.mjs'
      - 'bin/arwp-winners.mjs'
      - 'bin/arwp-recommendation-review.mjs'
      - 'bin/arwp-cohort.mjs'
      - 'scripts/winner-observatory-test.mjs'
      - 'scripts/recommendation-review-test.mjs'
      - 'scripts/controlled-cohort-test.mjs'
      - 'scripts/cohort-search-observation-test.mjs'
      - 'scripts/cohort-index-observation-test.mjs'
      - 'scripts/cohort-index-comparison-test.mjs'
      - 'scripts/cohort-web-observer-test.mjs'
      - 'scripts/evidence-lab-test.mjs'
      - 'docs/WINNER-OBSERVATORY.md'
      - 'docs/RECOMMENDATION-REVIEW.md'
      - 'docs/CONTROLLED-COHORTS.md'
      - 'skills/arwp-measurement-os/SKILL.md'
      - 'docs/evidence-lab/**'
      - 'docs/sitemap.xml'
      - 'knowledge/experiments/**'
      - 'knowledge/research/2026-09-09-external-evidence-winner-loop.json'
      - '.github/workflows/winner-observatory.yml'
  pull_request:
    paths:
      - 'schema/winner-observation.schema.json'
      - 'schema/recommendation-review-events.schema.json'
      - 'schema/controlled-cohort.schema.json'
      - 'lib/winner-observatory.mjs'
      - 'lib/recommendation-review.mjs'
      - 'lib/controlled-cohort.mjs'
      - 'lib/cohort-search-observation.mjs'
      - 'lib/cohort-index-observation.mjs'
      - 'lib/cohort-index-comparison.mjs'
      - 'lib/cohort-web-observer.mjs'
      - 'bin/arwp-winners.mjs'
      - 'bin/arwp-recommendation-review.mjs'
      - 'bin/arwp-cohort.mjs'
      - 'scripts/winner-observatory-test.mjs'
      - 'scripts/recommendation-review-test.mjs'
      - 'scripts/controlled-cohort-test.mjs'
      - 'scripts/cohort-search-observation-test.mjs'
      - 'scripts/cohort-index-observation-test.mjs'
      - 'scripts/cohort-index-comparison-test.mjs'
      - 'scripts/cohort-web-observer-test.mjs'
      - 'scripts/evidence-lab-test.mjs'
      - 'docs/WINNER-OBSERVATORY.md'
      - 'docs/RECOMMENDATION-REVIEW.md'
      - 'docs/CONTROLLED-COHORTS.md'
      - 'skills/arwp-measurement-os/SKILL.md'
      - 'docs/evidence-lab/**'
      - 'docs/sitemap.xml'
      - 'knowledge/experiments/**'
      - 'knowledge/research/2026-09-09-external-evidence-winner-loop.json'
      - '.github/workflows/winner-observatory.yml'

permissions:
  contents: read

jobs:
  evidence-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Winner Observatory engine
        run: |
          node scripts/winner-observatory-test.mjs
          node --check lib/winner-observatory.mjs
          node --check bin/arwp-winners.mjs
          node --check scripts/winner-observatory-test.mjs
          node -e "JSON.parse(require('fs').readFileSync('schema/winner-observation.schema.json','utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('knowledge/experiments/2026-09-09-ptichi-controlled-cohort-plan.json','utf8'));"
          node bin/arwp-winners.mjs --help | grep -q 'citation persistence'
      - name: Validate Recommendation Review queue
        run: |
          node scripts/recommendation-review-test.mjs
          node --check lib/recommendation-review.mjs
          node --check bin/arwp-recommendation-review.mjs
          node --check scripts/recommendation-review-test.mjs
          node -e "JSON.parse(require('fs').readFileSync('schema/recommendation-review-events.schema.json','utf8'));"
          node bin/arwp-recommendation-review.mjs --help | grep -q 'retire-candidate'
      - name: Validate Controlled Cohort contract
        run: |
          node scripts/controlled-cohort-test.mjs
          node scripts/cohort-search-observation-test.mjs
          node scripts/cohort-index-observation-test.mjs
          node scripts/cohort-index-comparison-test.mjs
          node scripts/cohort-web-observer-test.mjs
          node --check lib/cohort-web-observer.mjs
          node --check scripts/cohort-web-observer-test.mjs
          node --check lib/cohort-index-comparison.mjs
          node --check scripts/cohort-index-comparison-test.mjs
          node --check lib/controlled-cohort.mjs
          node --check lib/cohort-index-observation.mjs
          node --check scripts/cohort-index-observation-test.mjs
          node --check lib/cohort-search-observation.mjs
          node --check scripts/cohort-search-observation-test.mjs
          node --check bin/arwp-cohort.mjs
          node --check scripts/controlled-cohort-test.mjs
          node -e "JSON.parse(require('fs').readFileSync('schema/controlled-cohort.schema.json','utf8'));"
          node bin/arwp-cohort.mjs validate knowledge/experiments/2026-09-09-ptichi-cohort-freeze.json
          node bin/arwp-cohort.mjs summarize knowledge/experiments/2026-09-09-ptichi-cohort-freeze.json | grep -q 'Treatment/control: 12/6'
      - name: Validate public Evidence Lab
        run: |
          node scripts/evidence-lab-test.mjs
          node --check scripts/evidence-lab-test.mjs
          node -e "JSON.parse(require('fs').readFileSync('docs/evidence-lab/index.json','utf8'));"
