name: Site Focus Remediation Receipts

on:
  push:
    branches: [main]
    paths:
      - 'schema/site-focus-remediation-receipt-v0.1.schema.json'
      - 'docs/SITE-FOCUS-REMEDIATION-RECEIPTS.md'
      - 'docs/SITE-FOCUS-DEPLOYMENT-PROOF.md'
      - 'docs/examples/site-focus-remediation-receipt*.json'
      - 'scripts/site-focus-remediation-receipt-test.mjs'
      - '.github/workflows/site-focus-remediation-receipts.yml'
  pull_request:
    paths:
      - 'schema/site-focus-remediation-receipt-v0.1.schema.json'
      - 'docs/SITE-FOCUS-REMEDIATION-RECEIPTS.md'
      - 'docs/SITE-FOCUS-DEPLOYMENT-PROOF.md'
      - 'docs/examples/site-focus-remediation-receipt*.json'
      - 'scripts/site-focus-remediation-receipt-test.mjs'
      - '.github/workflows/site-focus-remediation-receipts.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Site Focus Remediation Receipt v0.1
        run: node scripts/site-focus-remediation-receipt-test.mjs
