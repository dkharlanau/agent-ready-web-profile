name: Publish ecosystem artifacts

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the current package to npm using trusted publishing
        required: true
        default: false
        type: boolean
      publish_mcp_registry:
        description: Publish server.json to the Official MCP Registry using GitHub OIDC
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - name: Inspect publish artifact
        run: npm pack --dry-run

  publish-npm:
    if: ${{ inputs.publish_npm }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Pack exact npm artifact
        id: pack
        shell: bash
        run: |
          npm pack --json > pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('pack.json','utf8'))[0].filename; console.log('path='+p)" >> "$GITHUB_OUTPUT"
      - name: Attest npm tarball provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.pack.outputs.path }}
      - name: Publish exact attested tarball through npm trusted publishing
        run: npm publish "${{ steps.pack.outputs.path }}" --access public

  publish-mcp-registry:
    if: ${{ inputs.publish_mcp_registry }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help
      - name: Authenticate to the Official MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io
      - name: Publish MCP metadata
        run: ./mcp-publisher publish ./server.json
