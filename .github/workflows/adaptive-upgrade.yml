name: Adaptive Site Upgrade validation

on:
  push:
    branches: [main]
    paths:
      - 'registry/adaptive-upgrade-packs.json'
      - 'schema/adaptive-upgrade-graph.schema.json'
      - 'lib/adaptive-upgrade.mjs'
      - 'bin/arwp-upgrade.mjs'
      - 'scripts/adaptive-upgrade-test.mjs'
      - 'skills/arwp-adaptive-upgrade/**'
      - 'docs/ADAPTIVE-SITE-UPGRADE.md'
      - '.github/workflows/adaptive-upgrade.yml'
  pull_request:
    paths:
      - 'registry/adaptive-upgrade-packs.json'
      - 'schema/adaptive-upgrade-graph.schema.json'
      - 'lib/adaptive-upgrade.mjs'
      - 'bin/arwp-upgrade.mjs'
      - 'scripts/adaptive-upgrade-test.mjs'
      - 'skills/arwp-adaptive-upgrade/**'
      - 'docs/ADAPTIVE-SITE-UPGRADE.md'
      - '.github/workflows/adaptive-upgrade.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate adaptive upgrade engine
        run: |
          node scripts/adaptive-upgrade-test.mjs
          node --check lib/adaptive-upgrade.mjs
          node --check bin/arwp-upgrade.mjs
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('registry/adaptive-upgrade-packs.json','utf8')); JSON.parse(fs.readFileSync('schema/adaptive-upgrade-graph.schema.json','utf8'));"
          node bin/arwp-upgrade.mjs packs
