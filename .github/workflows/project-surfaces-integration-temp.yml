name: Project Surfaces Integration Temporary

on:
  push:
    branches: [feature/project-maturity-surfaces-2026-09-09]
    paths:
      - '.github/workflows/project-surfaces-integration-temp.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Integrate project maturity surfaces
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = file => fs.readFileSync(file, 'utf8');
          const write = (file, content) => fs.writeFileSync(file, content);
          const replace = (file, from, to) => {
            const before = read(file);
            if (!before.includes(from)) throw new Error(`${file}: expected integration anchor not found`);
            const after = before.replace(from, to);
            if (after !== before) write(file, after);
          };

          replace(
            'docs/index.html',
            '<link rel="describedby" type="application/json" href="./ai/site-profile.json">',
            '<link rel="describedby" type="application/json" href="./ai/site-profile.json">\n  <link rel="describedby" type="application/json" href="./project/profile.json">'
          );
          replace(
            'docs/index.html',
            '<a href="./trust/">Trust</a><a href="./media/">Open media</a>',
            '<a href="./trust/">Trust</a><a href="./project/">Project &amp; Policies</a><a href="./project/rights.html">Rights</a><a href="./project/collaboration.html">Collaboration</a><a href="./media/">Open media</a>'
          );

          replace(
            'docs/llms.txt',
            '- [ARWP Trust Center](https://dkharlanau.github.io/agent-ready-web-profile/trust/): Maintainer identity, evidence policy, security, corrections, software provenance, persistent-identifier state, external trust signals and explicit limitations.',
            '- [ARWP Trust Center](https://dkharlanau.github.io/agent-ready-web-profile/trust/): Maintainer identity, evidence policy, security, corrections, software provenance, persistent-identifier state, external trust signals and explicit limitations.\n- [Goose ARWP Project & Policies](https://dkharlanau.github.io/agent-ready-web-profile/project/): Copyright/reuse, names and marks, partnership/collaboration, governance, privacy and project maturity routing.'
          );
          replace(
            'docs/llms.txt',
            '- [ARWP self-profile](https://dkharlanau.github.io/agent-ready-web-profile/ai/site-profile.json): Project identity, data surfaces, MCP servers, trust metadata and project extensions.',
            '- [ARWP self-profile](https://dkharlanau.github.io/agent-ready-web-profile/ai/site-profile.json): Project identity, data surfaces, MCP servers, trust metadata and project extensions.\n- [Project Surfaces manifest](https://dkharlanau.github.io/agent-ready-web-profile/project/profile.json): Machine-readable roles for project identity, rights, names/marks, collaboration, governance, contact routing, security, corrections, history and conditional policies.'
          );

          const updateProfile = file => {
            const value = JSON.parse(read(file));
            value.data ||= {};
            value.data.distributions ||= [];
            if (!value.data.distributions.some(item => item.url === 'https://dkharlanau.github.io/agent-ready-web-profile/project/profile.json')) {
              value.data.distributions.push({
                name: 'Goose ARWP Project & Policies manifest',
                url: 'https://dkharlanau.github.io/agent-ready-web-profile/project/profile.json',
                mediaType: 'application/json',
                role: 'other',
                description: 'Machine-readable project maturity roles for identity, rights, names and marks, collaboration, governance, contact routing and applicable policy surfaces; role presence is not legal certification or ranking evidence.'
              });
            }
            value.extensions ||= {};
            value.extensions['io.github.dkharlanau/project-maturity-surfaces'] = {
              version: '1.0',
              status: 'active-project-pattern',
              profile: 'https://dkharlanau.github.io/agent-ready-web-profile/project/profile.json',
              schema: 'https://raw.githubusercontent.com/dkharlanau/agent-ready-web-profile/main/schema/project-surfaces.schema.json',
              documentation: 'https://dkharlanau.github.io/agent-ready-web-profile/MATURITY-PROFILE.md',
              semantics: 'roles-not-page-count',
              legalCertification: false,
              rankingBenefitClaimed: false
            };
            write(file, JSON.stringify(value, null, 2) + '\n');
          };
          updateProfile('ai/site-profile.json');
          fs.copyFileSync('ai/site-profile.json', 'docs/ai/site-profile.json');

          replace(
            'docs/SITE-FOCUS-DOGFOOD.md',
            '- `https://metalhatscats.com/` — intentionally broader public-systems studio;',
            '- `https://github.com/metalhatscats/metalhatscats` — currently verified public MetalHatsCats repository surface; no standalone MetalHatsCats website domain is asserted by this note;'
          );
          replace(
            'docs/SITE-FOCUS-DOGFOOD.md',
            '## MetalHatsCats: broad-site control',
            '## MetalHatsCats: historical broad-site calibration — re-run required\n\n**Correction, 2026-09-09:** the previous dogfood note treated `metalhatscats.com` as a live target. The project owner clarified that this standalone domain is not in use. The IA observations below are retained as historical calibration context, not current production evidence. Re-run Site Focus against an actual published MetalHatsCats site before using these findings as current evidence.'
          );

          for (const file of ['ai/site-profile.json', 'docs/ai/site-profile.json', 'docs/project/profile.json']) JSON.parse(read(file));
          if (read('docs/index.html').includes('metalhatscats.com')) throw new Error('homepage contains stale MetalHatsCats domain');
          if (read('docs/SITE-FOCUS-DOGFOOD.md').includes('metalhatscats.com/')) throw new Error('dogfood still contains stale standalone domain URL');
          NODE
          node scripts/project-surfaces-test.mjs --site
          node scripts/maturity-profile-test.mjs --site
          node scripts/goose-brand-test.mjs
          node scripts/site-test.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs ai
          git commit -m "integrate project maturity surfaces across public profiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
