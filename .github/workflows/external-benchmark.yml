name: External resolver benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-benchmark.yml'
      - 'benchmarks/corpus/**'
      - 'benchmarks/external-runner.mjs'
      - 'benchmarks/publication-report.mjs'
      - 'benchmarks/publication-report-test.mjs'
      - 'benchmarks/federation-corpus.json'
      - 'benchmarks/federation-runner.mjs'
      - 'gateway/lib.mjs'
      - 'router/resolved-federated.mjs'
      - 'lib/resolver.mjs'
      - 'lib/resolver-adapters.mjs'
      - 'lib/scanner.mjs'
      - 'lib/http-discovery.mjs'
      - 'lib/public-fetch.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: external-resolver-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate reviewed corpus
        run: node benchmarks/corpus-test.mjs

      - name: Test publication sanitizer
        run: |
          node benchmarks/publication-report-test.mjs
          node --check benchmarks/publication-report.mjs

      - name: Run external benchmark
        run: |
          mkdir -p benchmark-results
          npm run benchmark:external -- --output=benchmark-results/external.json

      - name: Build sanitized publication report
        run: node benchmarks/publication-report.mjs --input=benchmark-results/external.json --output=benchmark-results/external-public.json

      - name: Run resolver-backed federation corpus
        run: npm run benchmark:federation-external -- --output=benchmark-results/federation.json

      - name: Write job summary
        if: always()
        run: |
          if [ -f benchmark-results/external.json ]; then
            node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('benchmark-results/external.json', 'utf8'));
          const lines = [
            '# ARWP external resolver benchmark',
            '',
            `Head: ${process.env.GITHUB_SHA}`,
            `Independent sites: ${report.independentSites}`,
            `Resolved: ${report.resolvedIndependentSites}`,
            `Failed: ${report.failedIndependentSites}`,
            `Sanitized publication report: ${fs.existsSync('benchmark-results/external-public.json') ? 'produced' : 'missing'}`,
            '',
            '| Strategy | Correct | Total | Accuracy |',
            '| --- | ---: | ---: | ---: |'
          ];
          for (const [strategy, result] of Object.entries(report.aggregate || {})) {
            const accuracy = result.accuracy == null ? 'n/a' : `${(result.accuracy * 100).toFixed(1)}%`;
            lines.push(`| ${strategy} | ${result.correct} | ${result.total} | ${accuracy} |`);
          }
          if (fs.existsSync('benchmark-results/federation.json')) {
            const federation = JSON.parse(fs.readFileSync('benchmark-results/federation.json', 'utf8'));
            lines.push(
              '',
              '## Resolver-backed federation corpus',
              '',
              `Independent sites: ${federation.independentSites}`,
              `Expected interfaces executed: ${federation.expectedInterfacesExecuted}`,
              `Sites with query hits: ${federation.sitesWithHits}`,
              '',
              '| Site | Status | Executed | Hits |',
              '| --- | --- | ---: | ---: |'
            );
            for (const site of federation.sites || []) {
              lines.push(`| ${site.id} | ${site.status} | ${(site.executed || []).length} | ${site.hits || 0} |`);
            }
          }
          lines.push('', '> Engineering evidence only. Ground truth is the reviewed corpus; Resolver output is never allowed to become its own ground truth. Sub-strategy rows are selection-only projections over the same Resolver observation, not independent network-performance measurements. Federation hit counts are not answer-quality measurements.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
          else
            echo '# ARWP external resolver benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo 'No result file was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arwp-external-benchmark-${{ github.run_id }}
          path: benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 90
