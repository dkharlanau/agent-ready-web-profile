name: External resolver benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-benchmark.yml'
      - 'benchmarks/corpus/**'
      - 'benchmarks/evidence-checker.mjs'
      - 'benchmarks/evidence-checker-test.mjs'
      - 'benchmarks/evidence-check.mjs'
      - 'benchmarks/external-runner.mjs'
      - 'benchmarks/publication-report.mjs'
      - 'benchmarks/publication-report-test.mjs'
      - 'benchmarks/selection-diagnostics.mjs'
      - 'benchmarks/selection-diagnostics-test.mjs'
      - 'benchmarks/federation-corpus.json'
      - 'benchmarks/federation-runner.mjs'
      - 'gateway/lib.mjs'
      - 'router/resolved-federated.mjs'
      - 'lib/resolver.mjs'
      - 'lib/resolver-adapters.mjs'
      - 'lib/scanner.mjs'
      - 'lib/http-discovery.mjs'
      - 'lib/public-fetch.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: external-resolver-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate reviewed corpus
        run: node benchmarks/corpus-test.mjs

      - name: Test evidence liveness checker
        run: node benchmarks/evidence-checker-test.mjs

      - name: Check reviewed evidence liveness
        run: |
          mkdir -p benchmark-results
          npm run benchmark:evidence -- --output=benchmark-results/evidence.json

      - name: Test publication sanitizer
        run: |
          node benchmarks/publication-report-test.mjs
          node --check benchmarks/publication-report.mjs

      - name: Test selection diagnostics
        run: |
          node benchmarks/selection-diagnostics-test.mjs
          node --check benchmarks/selection-diagnostics.mjs

      - name: Run external benchmark
        run: |
          mkdir -p benchmark-results
          npm run benchmark:external -- --output=benchmark-results/external.json

      - name: Build sanitized publication report
        run: node benchmarks/publication-report.mjs --input=benchmark-results/external.json --output=benchmark-results/external-public.json

      - name: Build publication-safe selection diagnostics
        run: node benchmarks/selection-diagnostics.mjs --input=benchmark-results/external-public.json --output=benchmark-results/external-diagnostics.json

      - name: Run resolver-backed federation corpus
        run: npm run benchmark:federation-external -- --output=benchmark-results/federation.json

      - name: Write job summary
        if: always()
        run: |
          if [ -f benchmark-results/external.json ]; then
            node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('benchmark-results/external.json', 'utf8'));
          const lines = [
            '# ARWP external resolver benchmark',
            '',
            `Head: ${process.env.GITHUB_SHA}`,
            `Independent sites: ${report.independentSites}`,
            `Resolved: ${report.resolvedIndependentSites}`,
            `Failed: ${report.failedIndependentSites}`,
            `Sanitized publication report: ${fs.existsSync('benchmark-results/external-public.json') ? 'produced' : 'missing'}`,
            `Selection diagnostics: ${fs.existsSync('benchmark-results/external-diagnostics.json') ? 'produced' : 'missing'}`,
            '',
            '| Strategy | Correct | Total | Accuracy |',
            '| --- | ---: | ---: | ---: |'
          ];
          for (const [strategy, result] of Object.entries(report.aggregate || {})) {
            const accuracy = result.accuracy == null ? 'n/a' : `${(result.accuracy * 100).toFixed(1)}%`;
            lines.push(`| ${strategy} | ${result.correct} | ${result.total} | ${accuracy} |`);
          }
          if (fs.existsSync('benchmark-results/external-diagnostics.json')) {
            const diagnostics = JSON.parse(fs.readFileSync('benchmark-results/external-diagnostics.json', 'utf8'));
            const categories = diagnostics.summary?.byCategory || {};
            lines.push(
              '',
              '## Resolver-union mismatch diagnostics',
              '',
              `Incorrect intent decisions: ${diagnostics.summary?.incorrect ?? 0}`,
              `Discovery gaps: ${categories['discovery-gap'] ?? 0}`,
              `Selection gaps: ${categories['selection-gap'] ?? 0}`,
              `Over-selection: ${categories['over-selection'] ?? 0}`,
              `Resolution failures: ${categories['resolution-failure'] ?? 0}`,
              '',
              '| Site | Correct | Total | Misses | Categories |',
              '| --- | ---: | ---: | ---: | --- |'
            );
            for (const site of (diagnostics.weakSites || []).slice(0, 10)) {
              const summary = Object.entries(site.categories || {}).map(([key, value]) => `${key}:${value}`).join(', ');
              lines.push(`| ${site.id} | ${site.correct} | ${site.total} | ${site.misses} | ${summary} |`);
            }
            lines.push('', '> Diagnostic categories classify mismatches against reviewed ground truth; URLs are publication-sanitized, accepted interfaces are unchanged, and the report is not adoption or answer-quality evidence.');
          }
          if (fs.existsSync('benchmark-results/evidence.json')) {
            const evidence = JSON.parse(fs.readFileSync('benchmark-results/evidence.json', 'utf8'));
            lines.push(
              '',
              '## Reviewed evidence liveness',
              '',
              `Targets checked: ${evidence.totals.targets}`,
              `HTTP 2xx: ${evidence.totals.reachable}`,
              `Restricted/method-specific (401/403/405/429): ${evidence.totals.restricted}`,
              `Missing (404/410): ${evidence.totals.missing}`,
              `Other unhealthy HTTP: ${evidence.totals.unhealthy}`,
              `Probe errors: ${evidence.totals.errors}`,
              `Redirected: ${evidence.totals.redirected}`,
              `Stale review dates: ${evidence.totals.staleReviews}`,
              '',
              '> This is transport-level observation only. HTTP 2xx or a restricted response does not re-confirm semantic ground truth or protocol correctness.'
            );
          }
          if (fs.existsSync('benchmark-results/federation.json')) {
            const federation = JSON.parse(fs.readFileSync('benchmark-results/federation.json', 'utf8'));
            lines.push(
              '',
              '## Resolver-backed federation corpus',
              '',
              `Independent sites: ${federation.independentSites}`,
              `Expected interfaces executed: ${federation.expectedInterfacesExecuted}`,
              `Sites with query hits: ${federation.sitesWithHits}`,
              '',
              '| Site | Status | Executed | Hits |',
              '| --- | --- | ---: | ---: |'
            );
            for (const site of federation.sites || []) {
              lines.push(`| ${site.id} | ${site.status} | ${(site.executed || []).length} | ${site.hits || 0} |`);
            }
          }
          lines.push('', '> Engineering evidence only. Ground truth is the reviewed corpus; Resolver output is never allowed to become its own ground truth. Sub-strategy rows are selection-only projections over the same Resolver observation, not independent network-performance measurements. Federation hit counts are not answer-quality measurements.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
          else
            echo '# ARWP external resolver benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo 'No result file was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arwp-external-benchmark-${{ github.run_id }}
          path: benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 90
