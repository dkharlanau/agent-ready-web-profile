name: Search Platform Eligibility

on:
  push:
    paths:
      - 'registry/search-platform-eligibility.json'
      - 'lib/search-platform-eligibility.mjs'
      - 'lib/growth-platform-eligibility.mjs'
      - 'lib/growth-plan-vertical.mjs'
      - 'bin/arwp-search-platform.mjs'
      - 'bin/arwp-growth.mjs'
      - 'scripts/search-platform-eligibility-test.mjs'
      - 'scripts/growth-platform-eligibility-test.mjs'
      - 'docs/SEARCH-PLATFORM-ELIGIBILITY.md'
      - '.github/workflows/search-platform-eligibility.yml'
  pull_request:
    paths:
      - 'registry/search-platform-eligibility.json'
      - 'lib/search-platform-eligibility.mjs'
      - 'lib/growth-platform-eligibility.mjs'
      - 'lib/growth-plan-vertical.mjs'
      - 'bin/arwp-search-platform.mjs'
      - 'bin/arwp-growth.mjs'
      - 'scripts/search-platform-eligibility-test.mjs'
      - 'scripts/growth-platform-eligibility-test.mjs'
      - 'docs/SEARCH-PLATFORM-ELIGIBILITY.md'
      - '.github/workflows/search-platform-eligibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-platform-eligibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate Search Platform Eligibility
        run: |
          node scripts/search-platform-eligibility-test.mjs
          node scripts/growth-platform-eligibility-test.mjs
      - name: Syntax check
        run: |
          node --check lib/search-platform-eligibility.mjs
          node --check lib/growth-platform-eligibility.mjs
          node --check lib/growth-plan-vertical.mjs
          node --check bin/arwp-search-platform.mjs
          node --check bin/arwp-growth.mjs
          node --check scripts/search-platform-eligibility-test.mjs
          node --check scripts/growth-platform-eligibility-test.mjs
      - name: CLI help smoke
        shell: bash
        run: |
          node bin/arwp-search-platform.mjs --help
          node bin/arwp-growth.mjs --help > "$RUNNER_TEMP/arwp-growth-help.txt"
          grep -Fq -- '--site-scope=hostname-root|subdirectory|unknown' "$RUNNER_TEMP/arwp-growth-help.txt"
