name: ARWP Future Search Lab

on:
  push:
    branches: [main]
    paths:
      - 'registry/future-search-experiments.json'
      - 'registry/page-manifest.json'
      - 'registry/entity-catalog.jsonld'
      - 'schema/future-search-experiments.schema.json'
      - 'schema/intent-ownership.schema.json'
      - 'schema/intent-ownership-surface-proof.schema.json'
      - 'lib/semantic-index.mjs'
      - 'lib/intent-ownership.mjs'
      - 'lib/intent-ownership-gate.mjs'
      - 'lib/intent-ownership-surface.mjs'
      - 'bin/arwp-semantic-index.mjs'
      - 'bin/arwp-intent-ownership.mjs'
      - 'scripts/future-search-test.mjs'
      - 'scripts/intent-ownership-test.mjs'
      - 'scripts/intent-ownership-gate-test.mjs'
      - 'scripts/intent-ownership-surface-test.mjs'
      - 'benchmarks/intent-ownership/**'
      - 'skills/arwp-future-search/**'
      - 'skills/arwp-search-maturity/**'
      - 'skills/index.json'
      - 'skills/README.md'
      - 'docs/FUTURE-SEARCH-LAB.md'
      - 'docs/INTENT-OWNERSHIP.md'
      - 'AGENTS.md'
      - '.github/workflows/future-search.yml'
  pull_request:
    paths:
      - 'registry/future-search-experiments.json'
      - 'registry/page-manifest.json'
      - 'registry/entity-catalog.jsonld'
      - 'schema/future-search-experiments.schema.json'
      - 'schema/intent-ownership.schema.json'
      - 'schema/intent-ownership-surface-proof.schema.json'
      - 'lib/semantic-index.mjs'
      - 'lib/intent-ownership.mjs'
      - 'lib/intent-ownership-gate.mjs'
      - 'lib/intent-ownership-surface.mjs'
      - 'bin/arwp-semantic-index.mjs'
      - 'bin/arwp-intent-ownership.mjs'
      - 'scripts/future-search-test.mjs'
      - 'scripts/intent-ownership-test.mjs'
      - 'scripts/intent-ownership-gate-test.mjs'
      - 'scripts/intent-ownership-surface-test.mjs'
      - 'benchmarks/intent-ownership/**'
      - 'skills/arwp-future-search/**'
      - 'skills/arwp-search-maturity/**'
      - 'skills/index.json'
      - 'skills/README.md'
      - 'docs/FUTURE-SEARCH-LAB.md'
      - 'docs/INTENT-OWNERSHIP.md'
      - 'AGENTS.md'
      - '.github/workflows/future-search.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Future Search registry, semantic index and intent ownership
        run: |
          node scripts/future-search-test.mjs
          node scripts/intent-ownership-test.mjs
          node scripts/intent-ownership-gate-test.mjs
          node scripts/intent-ownership-surface-test.mjs
          node --check lib/semantic-index.mjs
          node --check lib/intent-ownership.mjs
          node --check lib/intent-ownership-gate.mjs
          node --check lib/intent-ownership-surface.mjs
          node --check bin/arwp-semantic-index.mjs
          node --check bin/arwp-intent-ownership.mjs
          node --check scripts/future-search-test.mjs
          node --check scripts/intent-ownership-test.mjs
          node --check scripts/intent-ownership-gate-test.mjs
          node --check scripts/intent-ownership-surface-test.mjs
      - name: Exercise semantic index CLI
        run: |
          node bin/arwp-semantic-index.mjs build registry/page-manifest.json registry/entity-catalog.jsonld --output=/tmp/arwp-semantic-index.jsonld
          node bin/arwp-semantic-index.mjs check /tmp/arwp-semantic-index.jsonld
      - name: Exercise intent ownership CLI
        run: |
          node bin/arwp-intent-ownership.mjs check benchmarks/intent-ownership/public-fixture.json
          node bin/arwp-intent-ownership.mjs report benchmarks/intent-ownership/public-fixture.json > /tmp/arwp-intent-ownership-report.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/arwp-intent-ownership-report.json','utf8')); if(r.kind!=='intent-ownership-report'||r.summary.familyCount!==5||r.summary.byState.declined!==1||r.boundaries.queryVariantCreatesPage!==false||r.boundaries.declinedIntentCreatesPage!==false) process.exit(1)"
          if node bin/arwp-intent-ownership.mjs gate benchmarks/intent-ownership/public-fixture.json > /tmp/arwp-intent-ownership-gate.json; then
            echo "fixture gate unexpectedly passed" >&2
            exit 1
          fi
          node -e "const g=JSON.parse(require('fs').readFileSync('/tmp/arwp-intent-ownership-gate.json','utf8')); if(g.kind!=='intent-ownership-gate'||g.valid!==false||g.summary.servedFamilyCount!==4||g.summary.declinedFamilyCount!==1||g.summary.failingServedFamilyCount!==3) process.exit(1)"
      - name: Validate Future Search skill routing
        run: |
          node -e "const i=JSON.parse(require('fs').readFileSync('skills/index.json','utf8')); if(i.version!=='0.2'||!i.skills.some(s=>s.name==='arwp-future-search')||i.composition.futureSearch!=='arwp-future-search') process.exit(1)"
          grep -q '^name: arwp-future-search$' skills/arwp-future-search/SKILL.md
          grep -q 'registry/future-search-experiments.json' skills/arwp-future-search/SKILL.md
          grep -q 'Future Search Lab' docs/FUTURE-SEARCH-LAB.md
          grep -q 'Intent Ownership' docs/INTENT-OWNERSHIP.md
          grep -q 'technical eligibility proof' docs/INTENT-OWNERSHIP.md
          grep -q 'Future Search rules' AGENTS.md
