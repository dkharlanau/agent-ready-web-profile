name: One-time PolyForm Strict relicense

on:
  push:
    paths:
      - .github/workflows/relicense-polyform-strict-once.yml

permissions:
  contents: write

jobs:
  relicense:
    if: ${{ github.event.head_commit.message != 'Complete ARWP PolyForm Strict relicense' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Align first-party license metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function replaceInFile(file, replacements) {
            if (!fs.existsSync(file)) return;
            let text = fs.readFileSync(file, 'utf8');
            const before = text;
            for (const [from, to] of replacements) text = text.split(from).join(to);
            if (text !== before) fs.writeFileSync(file, text);
          }

          function walk(dir, fn) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p, fn);
              else fn(p);
            }
          }

          // Canonical Agent Skills and their published mirrors must not retain
          // per-file Apache grants after the repository relicense.
          for (const root of ['skills', 'docs/skills']) {
            walk(root, file => {
              if (path.basename(file) !== 'SKILL.md') return;
              replaceInFile(file, [['license: Apache-2.0', 'license: PolyForm-Strict-1.0.0']]);
            });
          }

          replaceInFile('scripts/agent-skills-test.mjs', [
            ["assert.match(frontmatter.license || '', /Apache-2\\.0/);", "assert.match(frontmatter.license || '', /PolyForm-Strict-1\\.0\\.0/);"]
          ]);

          replaceInFile('content/pages/product.md', [
            ['- License: Apache-2.0', '- License: PolyForm Strict 1.0.0'],
            ['- Current open-source price: 0', '- Source availability: public; commercial use, redistribution and derivative works require separate permission']
          ]);

          replaceInFile('docs/llms.txt', [
            ['Software remains Apache-2.0. Third-party logos, trademarks, screenshots, quotations and other third-party material are not included unless separately marked.', 'Current first-party software is licensed under PolyForm Strict 1.0.0. Earlier revisions released under Apache-2.0 retain those earlier license grants. Third-party logos, trademarks, screenshots, quotations and other third-party material are not included unless separately marked.']
          ]);

          replaceInFile('docs/media/index.html', [
            ['software source code, which remains Apache-2.0;', 'current first-party software source code, licensed under PolyForm Strict 1.0.0;']
          ]);

          replaceInFile('TRADEMARKS.md', [
            ['Apache-2.0', 'PolyForm Strict 1.0.0']
          ]);

          replaceInFile('CITATION.cff', [
            ['license: Apache-2.0', 'license: PolyForm-Strict-1.0.0']
          ]);

          // Keep historical Apache references in LICENSE, CONTRIBUTING and
          // CHANGELOG because earlier published revisions keep those grants.
          NODE

          rm -f .github/workflows/relicense-polyform-strict-once.yml

      - name: Verify license consistency
        shell: bash
        run: |
          node scripts/agent-skills-test.mjs
          node -e "const p=require('./package.json'); if(p.license!=='SEE LICENSE IN LICENSE') process.exit(1)"
          if grep -RIn --include='SKILL.md' 'license: Apache-2.0' skills docs/skills; then
            echo 'Stale Apache skill metadata remains.' >&2
            exit 1
          fi
          grep -q 'PolyForm Strict License 1.0.0' LICENSE

      - name: Commit one-time migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Complete ARWP PolyForm Strict relicense"
          git push origin HEAD:main
