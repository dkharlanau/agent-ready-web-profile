name: R4 scope evaluation

on:
  push:
    branches:
      - r4-resolver-dominance
    paths:
      - .github/workflows/r4-scope-evaluation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4-resolver-dominance
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frozen independent corpus
        run: node benchmarks/external-runner.mjs --output=/tmp/r4-scope.json
      - name: Report decision quality without changing ground truth
        run: |
          node benchmarks/selection-diagnostics.mjs /tmp/r4-scope.json --output=/tmp/r4-scope-diagnostics.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/r4-scope.json', 'utf8'));
          const diagnostics = JSON.parse(fs.readFileSync('/tmp/r4-scope-diagnostics.json', 'utf8'));
          console.log('AGGREGATE=' + JSON.stringify(report.aggregate));
          console.log('COVERAGE=' + report.resolvedIndependentSites + '/' + report.independentSites);
          console.log('DIAGNOSTICS=' + JSON.stringify(diagnostics.summary || diagnostics));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: r4-scope-evaluation
          path: |
            /tmp/r4-scope.json
            /tmp/r4-scope-diagnostics.json
