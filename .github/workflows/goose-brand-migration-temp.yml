name: Goose Brand Finalization Temporary

on:
  push:
    branches: [brand/goose-cleanup-2026-09-09]
    paths:
      - '.github/workflows/goose-brand-migration-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Add canonical Goose brand doc to package surface
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const legacy = 'docs/BRAND-CITE-GOOSE.md';
          const canonical = 'docs/BRAND-GOOSE.md';
          const legacyIndex = pkg.files.indexOf(legacy);
          if (legacyIndex < 0) throw new Error(`${legacy} missing from package files`);
          if (!pkg.files.includes(canonical)) pkg.files.splice(legacyIndex, 0, canonical);
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          node scripts/goose-brand-test.mjs
      - name: Commit package finalization
        run: |
          if git diff --quiet; then
            echo "Package surface already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(brand): ship canonical Goose brand document"
          git push origin "HEAD:${GITHUB_REF_NAME}"
