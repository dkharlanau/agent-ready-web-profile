name: Goose Brand Contract

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'ROADMAP.md'
      - 'TRADEMARKS.md'
      - 'package.json'
      - 'content/**'
      - 'docs/**'
      - 'lib/**'
      - 'skills/**'
      - 'registry/**'
      - 'research/product/**'
      - 'examples/**'
      - 'templates/**'
      - 'scripts/build-discoverability.mjs'
      - 'scripts/goose-brand-test.mjs'
      - 'scripts/goose-product-strategy-test.mjs'
      - '.github/workflows/goose-brand.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'ROADMAP.md'
      - 'TRADEMARKS.md'
      - 'package.json'
      - 'content/**'
      - 'docs/**'
      - 'lib/**'
      - 'skills/**'
      - 'registry/**'
      - 'research/product/**'
      - 'examples/**'
      - 'templates/**'
      - 'scripts/build-discoverability.mjs'
      - 'scripts/goose-brand-test.mjs'
      - 'scripts/goose-product-strategy-test.mjs'
      - '.github/workflows/goose-brand.yml'

permissions:
  contents: read

jobs:
  brand-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Goose product identity and strategy
        run: |
          node scripts/goose-brand-test.mjs
          node scripts/goose-product-strategy-test.mjs
          node --check scripts/goose-brand-test.mjs
          node --check scripts/goose-product-strategy-test.mjs
