name: Site Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - 'bin/arwp.mjs'
      - 'bin/arwp-core.mjs'
      - 'bin/arwp-site-gate.mjs'
      - 'lib/site-gate.mjs'
      - 'registry/site-readiness-checklist.json'
      - 'schema/site-gate-report.schema.json'
      - 'scripts/site-gate-test.mjs'
      - '.github/workflows/site-gate.yml'
  pull_request:
    paths:
      - 'bin/arwp.mjs'
      - 'bin/arwp-core.mjs'
      - 'bin/arwp-site-gate.mjs'
      - 'lib/site-gate.mjs'
      - 'registry/site-readiness-checklist.json'
      - 'schema/site-gate-report.schema.json'
      - 'scripts/site-gate-test.mjs'
      - '.github/workflows/site-gate.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Site Readiness Gate
        run: |
          node scripts/site-gate-test.mjs
          node --check lib/site-gate.mjs
          node --check bin/arwp-site-gate.mjs
          node --check bin/arwp.mjs
          node --check bin/arwp-core.mjs
          node bin/arwp.mjs site-gate --help
          node bin/arwp.mjs validate examples/minimal.site-profile.json
