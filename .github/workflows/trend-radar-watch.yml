name: Trend Radar source watch

on:
  workflow_dispatch:
  schedule:
    - cron: '11 5 * * *'

permissions:
  contents: read
  issues: write

jobs:
  watch-primary-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check official Search and agent-web sources
        run: node scripts/trend-source-watch.mjs --output=trend-source-report.json

      - name: Validate watcher code
        run: |
          node scripts/trend-source-watch-test.mjs
          node --check lib/trend-source-watch.mjs
          node --check scripts/trend-source-watch.mjs

      - name: Publish source-watch evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trend-radar-source-report
          path: trend-source-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open or refresh review issue when new primary-source candidates appear
        if: success()
        uses: actions/github-script@v8
        env:
          REPORT_FILE: trend-source-report.json
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
            if (!report.summary?.candidates) {
              core.info('No post-review primary-source candidates found.');
              return;
            }

            const title = 'Trend Radar: primary-source changes need review';
            const rows = report.candidates.map(item => {
              const when = item.publishedAt ? item.publishedAt.slice(0, 10) : 'unknown date';
              const url = item.url || '(no URL)';
              return `- **${item.provider} / ${item.sourceId}** — ${when} — [${item.title || item.type}](${url})`;
            }).join('\n');
            const failed = (report.results || []).filter(item => !item.ok);
            const failedText = failed.length
              ? `\n\nSource reachability warnings:\n${failed.map(item => `- ${item.sourceId}: ${item.error || item.status || 'unreachable'}`).join('\n')}`
              : '';
            const body = `## Primary-source review candidates\n\nThe scheduled ARWP Trend Radar found **${report.summary.candidates}** item(s) newer than the current review cutoff (${report.reviewedThrough}).\n\n${rows}${failedText}\n\n## Review rule\n\nThese are **candidates, not recommendations**. Review the primary source, decide whether the change is relevant to website visibility/citation/agent operability, then update \`registry/trends.json\` as WATCH/ADOPT/RETIRED only with evidence. Never auto-promote to ADOPT.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              core.info(`Created issue #${created.data.number}`);
            }
