name: ARWP validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate maturity evidence inventory
        run: |
          node scripts/maturity-profile-test.mjs --site
          node bin/arwp-maturity.mjs check docs/maturity/profile.json
          node --check lib/maturity-profile.mjs
          node --check bin/arwp-maturity.mjs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run contract tests
        run: npm test

      - name: Validate problem-first Site Focus
        run: |
          node scripts/site-focus-test.mjs
          node scripts/site-focus-engine-test.mjs
          node scripts/site-focus-dogfood.mjs
          node --check scripts/site-focus-test.mjs
          node --check scripts/site-focus-engine-test.mjs
          node --check scripts/site-focus-dogfood.mjs
          node --check lib/site-focus.mjs
          node --check bin/arwp-focus.mjs

      - name: Validate entity graph gap engine
        run: |
          node scripts/entity-gap-test.mjs
          node --check lib/entity-gap.mjs
          node --check bin/arwp-entities.mjs

      - name: Validate entity graph remediation engine
        run: |
          node scripts/entity-remediation-test.mjs
          node --check lib/entity-remediation.mjs
          node --check bin/arwp-entity-remediation.mjs

      - name: Validate Search Surface Blueprint
        run: |
          node scripts/search-surface-test.mjs
          node --check lib/search-surface-core.mjs
          node --check lib/search-surface.mjs
          node --check lib/site-improvement-deep.mjs
          node --check bin/arwp-surfaces.mjs

      - name: Validate unified Site Improvement Plan
        run: |
          node scripts/site-improvement-test.mjs
          node scripts/site-improvement-vertical-test.mjs
          node --check lib/site-improvement.mjs
          node --check lib/site-improvement-deep.mjs
          node --check lib/site-improvement-vertical.mjs
          node --check lib/growth-vertical-evidence.mjs
          node --check bin/arwp-improve.mjs
          node --check scripts/site-improvement-vertical-test.mjs

      - name: Validate dataset publication and DOI audit
        run: |
          node scripts/dataset-publication-test.mjs
          node --check lib/dataset-publication.mjs
          node --check bin/arwp-dataset.mjs
          node --check scripts/dataset-publication-test.mjs

      - name: Validate adaptive content profile
        run: |
          node scripts/content-profile-test.mjs
          node --check lib/content-profile.mjs
          node --check bin/arwp-content.mjs

      - name: Validate product classification and competitor surface
        run: node scripts/classification-test.mjs

      - name: Test official A2A JS signature interoperability
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @a2a-js/sdk@1.0.1
          node scripts/a2a-js-interoperability-test.mjs

      - name: Test official A2A Python signature interoperability
        run: |
          python -m pip install --disable-pip-version-check 'a2a-sdk[signing,encryption]==1.1.2'
          node scripts/a2a-python-interoperability-test.mjs

      - name: Test benchmark publication sanitizer
        run: |
          node benchmarks/publication-report-test.mjs
          node --check benchmarks/publication-report.mjs

      - name: Test benchmark decision diagnostics, regret, and truth re-review workflow
        run: |
          node benchmarks/selection-diagnostics-test.mjs
          node benchmarks/resolver-regret-test.mjs
          node benchmarks/live-capability-drift-test.mjs
          node benchmarks/ground-truth-review-test.mjs
          node --check benchmarks/selection-diagnostics.mjs
          node --check benchmarks/ground-truth-review.mjs

      - name: Test bounded large-homepage scanning
        run: node scripts/scanner-large-homepage-test.mjs

      - name: Smoke-test npm package
        run: npm run test:package

      - name: Smoke-test improvement package surface
        run: node scripts/package-improvement-smoke-test.mjs

      - name: Validate examples through CLI
        run: |
          node bin/arwp.mjs validate examples/minimal.site-profile.json
          node bin/arwp.mjs validate examples/knowledge-site.site-profile.json

      - name: Exercise reusable GitHub Action
        uses: ./
        with:
          profile: examples/minimal.site-profile.json