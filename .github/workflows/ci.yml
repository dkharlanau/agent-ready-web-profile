name: ARWP validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate repository memory
        run: node scripts/repository-memory-test.mjs

      - name: Validate validation contract
        run: node scripts/validation-contract-test.mjs

      - name: Validate maturity evidence inventory
        run: node scripts/validation-contract.mjs ci-maturity

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run contract tests
        run: npm test

      - name: Validate problem-first Site Focus
        run: node scripts/validation-contract.mjs ci-site-focus

      - name: Dogfood declared Site Focus contract
        run: |
          node bin/arwp-focus.mjs https://dkharlanau.github.io/agent-ready-web-profile/ --repo-root=. --max-pages=30 --json > /tmp/cite-goose-focus.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/cite-goose-focus.json','utf8')); if(r.version!=='0.3') throw new Error('expected latest Site Focus v0.3'); if(!r.declaredFocus) throw new Error('declared focus missing'); if(!r.experienceContract) throw new Error('experience contract missing'); if(r.experienceContract.performance?.assessmentState!=='field-data-required') throw new Error('performance evidence boundary missing'); if('score' in r) throw new Error('opaque score forbidden'); if(r.transformationHandoff?.executable!==false) throw new Error('handoff must remain proposal-only'); if(r.guardrails?.noCompositeFocusExperienceScore!==true) throw new Error('no-composite-score guardrail missing');"

      - name: Validate entity graph gap engine
        run: node scripts/validation-contract.mjs ci-entity-gap

      - name: Validate entity graph remediation engine
        run: node scripts/validation-contract.mjs ci-entity-remediation

      - name: Validate Search Surface Blueprint
        run: node scripts/validation-contract.mjs ci-search-surface

      - name: Validate unified Site Improvement Plan
        run: node scripts/validation-contract.mjs ci-site-improvement

      - name: Validate dataset publication and DOI audit
        run: node scripts/validation-contract.mjs ci-dataset

      - name: Validate adaptive content profile
        run: node scripts/validation-contract.mjs ci-content-profile

      - name: Validate product classification and competitor surface
        run: node scripts/validation-contract.mjs ci-classification

      - name: Test official A2A JS signature interoperability
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @a2a-js/sdk@1.0.1
          node scripts/a2a-js-interoperability-test.mjs

      - name: Test official A2A Python signature interoperability
        run: |
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple 'a2a-sdk[signing,encryption]==1.1.2'
          node scripts/a2a-python-interoperability-test.mjs

      - name: Test benchmark publication sanitizer
        run: node scripts/validation-contract.mjs ci-benchmark-publication

      - name: Test benchmark decision diagnostics, regret, and truth re-review workflow
        run: node scripts/validation-contract.mjs ci-benchmark-diagnostics

      - name: Test bounded large-homepage scanning
        run: node scripts/validation-contract.mjs ci-large-homepage

      - name: Smoke-test npm package
        run: npm run test:package

      - name: Smoke-test improvement package surface
        run: node scripts/validation-contract.mjs ci-package-improvement

      - name: Validate examples through CLI
        run: node scripts/validation-contract.mjs ci-examples

      - name: Exercise reusable GitHub Action
        uses: ./
        with:
          profile: examples/minimal.site-profile.json
