name: Earned Discovery

on:
  push:
    paths:
      - 'registry/earned-discovery-practices.json'
      - 'lib/earned-discovery.mjs'
      - 'bin/arwp-earned-discovery.mjs'
      - 'scripts/earned-discovery-test.mjs'
      - 'docs/EARNED-DISCOVERY.md'
      - '.github/workflows/earned-discovery.yml'
  pull_request:
    paths:
      - 'registry/earned-discovery-practices.json'
      - 'lib/earned-discovery.mjs'
      - 'bin/arwp-earned-discovery.mjs'
      - 'scripts/earned-discovery-test.mjs'
      - 'docs/EARNED-DISCOVERY.md'
      - '.github/workflows/earned-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earned-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate Earned Discovery
        run: node scripts/earned-discovery-test.mjs
      - name: Syntax check
        run: |
          node --check lib/earned-discovery.mjs
          node --check bin/arwp-earned-discovery.mjs
          node --check scripts/earned-discovery-test.mjs
      - name: CLI help smoke
        run: node bin/arwp-earned-discovery.mjs --help
