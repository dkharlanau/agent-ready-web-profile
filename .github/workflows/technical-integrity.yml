name: Technical Integrity

on:
  push:
    paths:
      - 'registry/technical-integrity-rules.json'
      - 'lib/technical-integrity.mjs'
      - 'bin/arwp-technical-integrity.mjs'
      - 'bin/arwp.mjs'
      - 'scripts/technical-integrity-test.mjs'
      - 'schema/technical-integrity-report.schema.json'
      - 'docs/TECHNICAL-INTEGRITY.md'
      - '.github/workflows/technical-integrity.yml'
  pull_request:
    paths:
      - 'registry/technical-integrity-rules.json'
      - 'lib/technical-integrity.mjs'
      - 'bin/arwp-technical-integrity.mjs'
      - 'bin/arwp.mjs'
      - 'scripts/technical-integrity-test.mjs'
      - 'schema/technical-integrity-report.schema.json'
      - 'docs/TECHNICAL-INTEGRITY.md'
      - '.github/workflows/technical-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Technical Integrity rule pack
        run: node -e "const fs=require('fs'); const rules=JSON.parse(fs.readFileSync('registry/technical-integrity-rules.json','utf8')); if(!rules.rules?.length) throw new Error('empty Technical Integrity rules'); const ids=rules.rules.map(r=>r.id); if(new Set(ids).size!==ids.length) throw new Error('duplicate Technical Integrity rule id'); if(rules.methodology?.noCompositeScore!==true) throw new Error('noCompositeScore guardrail missing'); JSON.parse(fs.readFileSync('schema/technical-integrity-report.schema.json','utf8'));"
      - name: Run Technical Integrity regression
        run: node scripts/technical-integrity-test.mjs
      - name: Syntax check
        run: |
          node --check lib/technical-integrity.mjs
          node --check bin/arwp-technical-integrity.mjs
          node --check bin/arwp.mjs
          node --check scripts/technical-integrity-test.mjs
      - name: CLI help smoke
        run: |
          node bin/arwp-technical-integrity.mjs --help
          node bin/arwp.mjs technical-integrity --help
      - name: Dogfood live Goose site
        id: dogfood
        shell: bash
        run: |
          set +e
          node bin/arwp.mjs technical-integrity https://dkharlanau.github.io/agent-ready-web-profile/ --max-pages=8 --concurrency=2 --timeout=12000 --json > technical-integrity-goose.json
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Live Technical Integrity execution failed fatally."
            cat technical-integrity-goose.json || true
            exit 1
          fi
          echo "audit_exit=$code" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('technical-integrity-goose.json', 'utf8'));
          const findings = report.checks
            .filter(item => item.status !== 'pass' && item.status !== 'not-applicable')
            .map(item => ({ id: item.id, priority: item.priority, status: item.status, message: item.message }));
          console.log(JSON.stringify({ canonicalUrl: report.canonicalUrl, summary: report.summary, findings }, null, 2));
          NODE
      - name: Upload live Goose Technical Integrity report
        uses: actions/upload-artifact@v4
        with:
          name: goose-technical-integrity
          path: technical-integrity-goose.json
          if-no-files-found: error
          retention-days: 14
