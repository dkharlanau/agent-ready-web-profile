name: Technical Integrity

on:
  push:
    paths:
      - 'registry/technical-integrity-rules.json'
      - 'lib/technical-integrity.mjs'
      - 'bin/arwp-technical-integrity.mjs'
      - 'bin/arwp.mjs'
      - 'skills/arwp-growth-loop/SKILL.md'
      - 'scripts/technical-integrity-test.mjs'
      - 'scripts/sync-technical-preflight-instructions.mjs'
      - 'scripts/technical-preflight-instructions-test.mjs'
      - 'schema/technical-integrity-report.schema.json'
      - 'AGENTS.md'
      - 'docs/AGENTS.md'
      - 'docs/TECHNICAL-INTEGRITY.md'
      - 'docs/discoverability.html'
      - 'docs/discoverability/**'
      - 'docs/sitemap.xml'
      - 'docs/sitemap.md'
      - '.github/workflows/technical-integrity.yml'
  pull_request:
    paths:
      - 'registry/technical-integrity-rules.json'
      - 'lib/technical-integrity.mjs'
      - 'bin/arwp-technical-integrity.mjs'
      - 'bin/arwp.mjs'
      - 'skills/arwp-growth-loop/SKILL.md'
      - 'scripts/technical-integrity-test.mjs'
      - 'scripts/sync-technical-preflight-instructions.mjs'
      - 'scripts/technical-preflight-instructions-test.mjs'
      - 'schema/technical-integrity-report.schema.json'
      - 'AGENTS.md'
      - 'docs/AGENTS.md'
      - 'docs/TECHNICAL-INTEGRITY.md'
      - 'docs/discoverability.html'
      - 'docs/discoverability/**'
      - 'docs/sitemap.xml'
      - 'docs/sitemap.md'
      - '.github/workflows/technical-integrity.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]

permissions:
  contents: write

env:
  LIVE_GOOSE_URL: https://dkharlanau.github.io/agent-ready-web-profile/

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Synchronize agent Technical Integrity preflight contract
        run: node scripts/sync-technical-preflight-instructions.mjs
      - name: Validate agent Technical Integrity preflight contract
        run: node scripts/technical-preflight-instructions-test.mjs
      - name: Validate Technical Integrity rule pack
        run: node -e "const fs=require('fs'); const rules=JSON.parse(fs.readFileSync('registry/technical-integrity-rules.json','utf8')); if(!rules.rules?.length) throw new Error('empty Technical Integrity rules'); const ids=rules.rules.map(r=>r.id); if(new Set(ids).size!==ids.length) throw new Error('duplicate Technical Integrity rule id'); if(rules.methodology?.noCompositeScore!==true) throw new Error('noCompositeScore guardrail missing'); JSON.parse(fs.readFileSync('schema/technical-integrity-report.schema.json','utf8'));"
      - name: Run Technical Integrity regression
        run: node scripts/technical-integrity-test.mjs
      - name: Syntax check
        run: |
          node --check lib/technical-integrity.mjs
          node --check bin/arwp-technical-integrity.mjs
          node --check bin/arwp.mjs
          node --check scripts/technical-integrity-test.mjs
          node --check scripts/sync-technical-preflight-instructions.mjs
          node --check scripts/technical-preflight-instructions-test.mjs
      - name: CLI help smoke
        run: |
          node bin/arwp-technical-integrity.mjs --help
          node bin/arwp.mjs technical-integrity --help
      - name: Commit synchronized agent instructions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add AGENTS.md docs/AGENTS.md
          if git diff --cached --quiet; then
            echo 'Agent Technical Integrity instructions already match the canonical contract.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Technical Integrity agent preflight'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Confirm deployed bounded discoverability layout
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          for attempt in {1..6}; do
            if curl -fsSL --max-time 15 "${LIVE_GOOSE_URL}discoverability.html" | grep -q 'STATIC EVIDENCE HUBS'; then
              echo 'Observed bounded discoverability layout after Pages deployment.'
              exit 0
            fi
            sleep 5
          done
          echo 'Pages deployment completed but the bounded discoverability marker is not observable.'
          exit 1
      - name: Dogfood live Goose site
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        id: dogfood
        shell: bash
        run: |
          set +e
          node bin/arwp.mjs technical-integrity "$LIVE_GOOSE_URL" --max-pages=8 --concurrency=2 --timeout=12000 --json > technical-integrity-goose.json
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo 'Live Technical Integrity execution failed fatally.'
            cat technical-integrity-goose.json || true
            exit 1
          fi
          echo "audit_exit=$code" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('technical-integrity-goose.json', 'utf8'));
          const findings = report.checks
            .filter(item => item.status !== 'pass' && item.status !== 'not-applicable')
            .map(item => ({ id: item.id, priority: item.priority, status: item.status, message: item.message }));
          console.log(JSON.stringify({ canonicalUrl: report.canonicalUrl, summary: report.summary, findings }, null, 2));
          NODE
      - name: Upload live Goose Technical Integrity report
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: goose-technical-integrity
          path: technical-integrity-goose.json
          if-no-files-found: error
          retention-days: 14
