name: ARWP Growth Profile

on:
  push:
    branches: [main]
    paths:
      - 'registry/growth-opportunities.json'
      - 'registry/growth-verticals.json'
      - 'registry/trends.json'
      - 'schema/growth-policy.schema.json'
      - 'schema/growth-experiment.schema.json'
      - 'schema/growth-remediation-manifest.schema.json'
      - 'examples/growth-policy.example.json'
      - 'lib/growth-profile.mjs'
      - 'lib/growth-plan.mjs'
      - 'lib/growth-plan-vertical.mjs'
      - 'lib/growth-vertical-evidence.mjs'
      - 'lib/growth-policy.mjs'
      - 'lib/growth-history.mjs'
      - 'lib/growth-experiment.mjs'
      - 'lib/growth-experiment-ledger.mjs'
      - 'lib/growth-remediation.mjs'
      - 'lib/trend-radar.mjs'
      - 'lib/trend-history.mjs'
      - 'bin/arwp-growth.mjs'
      - 'bin/arwp-growth-policy.mjs'
      - 'bin/arwp-growth-history.mjs'
      - 'bin/arwp-growth-experiment.mjs'
      - 'bin/arwp-growth-remediation.mjs'
      - 'bin/arwp-trends.mjs'
      - 'bin/arwp-trend-history.mjs'
      - 'scripts/growth-profile-test.mjs'
      - 'scripts/growth-vertical-evidence-test.mjs'
      - 'scripts/growth-policy-test.mjs'
      - 'scripts/growth-history-test.mjs'
      - 'scripts/growth-experiment-test.mjs'
      - 'scripts/growth-experiment-ledger-test.mjs'
      - 'scripts/growth-remediation-test.mjs'
      - 'scripts/growth-package-test.mjs'
      - 'scripts/trend-radar-test.mjs'
      - 'scripts/trend-history-test.mjs'
      - 'scripts/trend-package-test.mjs'
      - 'package.json'
      - 'templates/growth/**'
      - 'docs/GROWTH-PROFILE.md'
      - 'docs/GROWTH-POLICY.md'
      - 'docs/GROWTH-LOOP.md'
      - 'docs/GROWTH-EXPERIMENTS.md'
      - 'docs/GROWTH-REMEDIATION.md'
      - 'docs/GROWTH-LEARNING.md'
      - 'docs/TREND-RADAR.md'
      - 'docs/TREND-HISTORY.md'
      - 'docs/growth/**'
      - 'docs/trends/**'
      - '.github/workflows/growth-profile.yml'
  pull_request:
    paths:
      - 'registry/growth-opportunities.json'
      - 'registry/growth-verticals.json'
      - 'registry/trends.json'
      - 'schema/growth-policy.schema.json'
      - 'schema/growth-experiment.schema.json'
      - 'schema/growth-remediation-manifest.schema.json'
      - 'examples/growth-policy.example.json'
      - 'lib/growth-profile.mjs'
      - 'lib/growth-plan.mjs'
      - 'lib/growth-plan-vertical.mjs'
      - 'lib/growth-vertical-evidence.mjs'
      - 'lib/growth-policy.mjs'
      - 'lib/growth-history.mjs'
      - 'lib/growth-experiment.mjs'
      - 'lib/growth-experiment-ledger.mjs'
      - 'lib/growth-remediation.mjs'
      - 'lib/trend-radar.mjs'
      - 'lib/trend-history.mjs'
      - 'bin/arwp-growth.mjs'
      - 'bin/arwp-growth-policy.mjs'
      - 'bin/arwp-growth-history.mjs'
      - 'bin/arwp-growth-experiment.mjs'
      - 'bin/arwp-growth-remediation.mjs'
      - 'bin/arwp-trends.mjs'
      - 'bin/arwp-trend-history.mjs'
      - 'scripts/growth-profile-test.mjs'
      - 'scripts/growth-vertical-evidence-test.mjs'
      - 'scripts/growth-policy-test.mjs'
      - 'scripts/growth-history-test.mjs'
      - 'scripts/growth-experiment-test.mjs'
      - 'scripts/growth-experiment-ledger-test.mjs'
      - 'scripts/growth-remediation-test.mjs'
      - 'scripts/growth-package-test.mjs'
      - 'scripts/trend-radar-test.mjs'
      - 'scripts/trend-history-test.mjs'
      - 'scripts/trend-package-test.mjs'
      - 'package.json'
      - 'templates/growth/**'
      - 'docs/GROWTH-PROFILE.md'
      - 'docs/GROWTH-POLICY.md'
      - 'docs/GROWTH-LOOP.md'
      - 'docs/GROWTH-EXPERIMENTS.md'
      - 'docs/GROWTH-REMEDIATION.md'
      - 'docs/GROWTH-LEARNING.md'
      - 'docs/TREND-RADAR.md'
      - 'docs/TREND-HISTORY.md'
      - 'docs/growth/**'
      - 'docs/trends/**'
      - '.github/workflows/growth-profile.yml'

permissions:
  contents: read

jobs:
  growth-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Growth Profile registry, planner, vertical evidence and templates
        run: |
          node scripts/growth-profile-test.mjs
          node scripts/growth-vertical-evidence-test.mjs
          node --check lib/growth-profile.mjs
          node --check lib/growth-plan.mjs
          node --check lib/growth-plan-vertical.mjs
          node --check lib/growth-vertical-evidence.mjs
          node --check bin/arwp-growth.mjs
          node --check scripts/growth-profile-test.mjs
          node --check scripts/growth-vertical-evidence-test.mjs
      - name: Validate Trend Radar registry, lifecycle, package surface and history
        run: |
          node scripts/trend-radar-test.mjs
          node scripts/trend-history-test.mjs
          node scripts/trend-package-test.mjs
          node bin/arwp-trends.mjs check
          node --check lib/trend-radar.mjs
          node --check lib/trend-history.mjs
          node --check bin/arwp-trends.mjs
          node --check bin/arwp-trend-history.mjs
          node --check scripts/trend-radar-test.mjs
          node --check scripts/trend-history-test.mjs
          node --check scripts/trend-package-test.mjs
          cmp registry/trends.json docs/trends/trends.json
          grep -q 'Find the Search and AI changes worth acting on' docs/trends/index.html
          grep -q 'WATCH: emerging' docs/trends/llms.txt
      - name: Validate Growth Policy contract, verticals and compiler
        run: |
          node scripts/growth-policy-test.mjs
          node --check lib/growth-policy.mjs
          node --check bin/arwp-growth-policy.mjs
          node --check scripts/growth-policy-test.mjs
      - name: Validate Growth history and implementation-state diff
        run: |
          node scripts/growth-history-test.mjs
          node --check lib/growth-history.mjs
          node --check bin/arwp-growth-history.mjs
          node --check scripts/growth-history-test.mjs
      - name: Validate Growth experiment evidence loop and managed ledger
        run: |
          node scripts/growth-experiment-test.mjs
          node scripts/growth-experiment-ledger-test.mjs
          node --check lib/growth-experiment.mjs
          node --check lib/growth-experiment-ledger.mjs
          node --check bin/arwp-growth-experiment.mjs
          node --check scripts/growth-experiment-test.mjs
          node --check scripts/growth-experiment-ledger-test.mjs
          node bin/arwp-growth-experiment.mjs --help | grep -q 'status \[<directory>\]'
          node -e "JSON.parse(require('fs').readFileSync('schema/growth-experiment.schema.json','utf8'));"
      - name: Validate proposal-only Growth remediation
        run: |
          node scripts/growth-remediation-test.mjs
          node --check lib/growth-remediation.mjs
          node --check bin/arwp-growth-remediation.mjs
          node --check scripts/growth-remediation-test.mjs
          node bin/arwp-growth-remediation.mjs --help | grep -q 'proposal-only'
          node -e "JSON.parse(require('fs').readFileSync('schema/growth-remediation-manifest.schema.json','utf8'));"
      - name: Validate packaged Growth Loop surface
        run: |
          node scripts/growth-package-test.mjs
          node --check scripts/growth-package-test.mjs
      - name: Validate shipped templates
        run: |
          node -e "JSON.parse(require('fs').readFileSync('templates/growth/organization.jsonld','utf8')); JSON.parse(require('fs').readFileSync('templates/growth/article.jsonld','utf8'));"
          grep -q 'Content-Signal: search=yes, ai-input=yes, ai-train=no, use=reference' templates/growth/robots.ai-search-open-training-closed.txt
          grep -q 'google.com/preferences/source?q=example.com' templates/growth/preferred-source.html
          grep -q 'issues: write' templates/growth/github-action-issue.yml
          grep -q 'ARWP_EXPERIMENT_DIR: .arwp-evidence/growth/experiments' templates/growth/github-action-issue.yml
          grep -q "ARWP_TREND_TIMEOUT_MS: '12000'" templates/growth/github-action-issue.yml
          grep -q 'Build Trend review queues' templates/growth/github-action-issue.yml
          grep -q 'WATCH → ADOPT review' templates/growth/github-action-issue.yml
          grep -q 'ADOPT → MEASURED review' templates/growth/github-action-issue.yml
          grep -q 'arwp-growth-material-sha256' templates/growth/github-action-issue.yml
          grep -q 'managed issue left untouched' templates/growth/github-action-issue.yml
          grep -q 'arwp-trend-promotions.json' templates/growth/github-action-issue.yml
          grep -q 'arwp-trend-measurement.json' templates/growth/github-action-issue.yml
          grep -q 'Experiment follow-up' templates/growth/github-action-issue.yml
          grep -q 'arwp-experiment-status.json' templates/growth/github-action-issue.yml
          grep -q 'issue.title === process.env.ARWP_ISSUE_TITLE' templates/growth/github-action-issue.yml
      - name: Validate public Growth Profile surfaces
        run: |
          node -e "const p=JSON.parse(require('fs').readFileSync('docs/growth/profile.json','utf8')); if (p.profile !== '2026-09-06' || p.guardrails.rankingGuarantee !== false || p.guardrails.aiRecommendationGuarantee !== false) process.exit(1);"
          grep -q 'Connect a site. Get a defensible improvement backlog.' docs/growth/index.html
          grep -q 'no universal quality/readiness score' docs/growth/llms.txt
          grep -q 'Tell ARWP what the site is actually trying to achieve.' docs/growth/policy.html
