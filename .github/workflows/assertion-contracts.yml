name: Assertion contract integrity

on:
  push:
    branches: [main]
    paths:
      - 'lib/assertion-contract.mjs'
      - 'bin/arwp-assert.mjs'
      - 'schema/assertion-contract.schema.json'
      - 'scripts/assertion-contract-test.mjs'
      - 'scripts/assertion-cli-test.mjs'
      - 'examples/agent-surface.contract.json'
      - 'docs/ASSERTION-CONTRACTS.md'
      - 'lib/evidence-receipt.mjs'
      - 'schema/evidence-receipt.schema.json'
      - 'package.json'
      - '.github/workflows/assertion-contracts.yml'
  pull_request:
    paths:
      - 'lib/assertion-contract.mjs'
      - 'bin/arwp-assert.mjs'
      - 'schema/assertion-contract.schema.json'
      - 'scripts/assertion-contract-test.mjs'
      - 'scripts/assertion-cli-test.mjs'
      - 'examples/agent-surface.contract.json'
      - 'docs/ASSERTION-CONTRACTS.md'
      - 'lib/evidence-receipt.mjs'
      - 'schema/evidence-receipt.schema.json'
      - 'package.json'
      - '.github/workflows/assertion-contracts.yml'

permissions:
  contents: read

jobs:
  assertions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate assertion contract engine, schema and CLI
        run: npm run test:assert
      - name: Smoke-test npm artifact with arwp-assert included
        run: npm run test:package
