name: ARD v0.91 compatibility

on:
  push:
    branches: [main]
    paths:
      - 'lib/ard-v091.mjs'
      - 'lib/ard-registry.mjs'
      - 'bin/arwp-ard.mjs'
      - 'scripts/ard-v091-test.mjs'
      - 'scripts/ard-registry-test.mjs'
      - 'scripts/ard-cli-test.mjs'
      - 'package.json'
      - 'docs/ARD-V0.91.md'
      - '.github/workflows/ard-v091.yml'
  pull_request:
    paths:
      - 'lib/ard-v091.mjs'
      - 'lib/ard-registry.mjs'
      - 'bin/arwp-ard.mjs'
      - 'scripts/ard-v091-test.mjs'
      - 'scripts/ard-registry-test.mjs'
      - 'scripts/ard-cli-test.mjs'
      - 'package.json'
      - 'docs/ARD-V0.91.md'
      - '.github/workflows/ard-v091.yml'

permissions:
  contents: read

jobs:
  ard-v091:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate ARD v0.91 static, registry and CLI layers
        run: npm run test:ard
      - name: Smoke-test npm artifact with arwp-ard included
        run: npm run test:package
