name: R4 OpenAPI search eligibility

on:
  push:
    branches:
      - r4-resolver-dominance
    paths:
      - .github/workflows/r4-openapi-search-eligibility.yml

permissions:
  contents: write

jobs:
  patch-test-benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4-resolver-dominance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply general eligibility rule and regret diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('lib/resolver-core.mjs')
          text = core.read_text(encoding='utf-8')
          old = '''  if (intent === 'search') {\n    if (item.kind === 'search') return 110 + sourceBoost;\n    if (item.kind === 'index') return 100 + sourceBoost;\n    if (item.protocol === 'OpenAPI') return 60 + sourceBoost;\n  }'''
          new = '''  if (intent === 'search') {\n    if (item.kind === 'search') return 110 + sourceBoost;\n    if (item.kind === 'index') return 100 + sourceBoost;\n    // OpenAPI describes an API surface; it is not evidence that the API supports search.\n    // Search eligibility requires an explicit retrieval/search semantic from an adapter.\n  }'''
          if old not in text:
              raise SystemExit('search scoring marker not found')
          core.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('scripts/resolver-test.mjs')
          text = test.read_text(encoding='utf-8')
          marker = '''assert.equal(planResolvedSite(plain, 'search').selected, null);\n\nawait assert.rejects'''
          insertion = '''assert.equal(planResolvedSite(plain, 'search').selected, null);\n\n// A generic API description is structured evidence, not an implicit search endpoint.\nconst apiOnlyFetch = async (url, options = {}) => {\n  const key = String(url);\n  if (key === 'https://api-only.example/') {\n    if (options.method === 'HEAD') return response(key, '', { contentType: 'text/html; charset=utf-8' });\n    return response(key, '<!doctype html><html><head><title>API only</title></head><body></body></html>', { contentType: 'text/html; charset=utf-8' });\n  }\n  if (key === 'https://api-only.example/.well-known/api-catalog') {\n    return response(key, JSON.stringify({ linkset: [{ anchor: 'https://api-only.example/api', 'service-desc': [{ href: 'https://api-only.example/openapi.json', type: 'application/json' }] }] }), { contentType: 'application/linkset+json' });\n  }\n  return response(key, 'not found', { status: 404, contentType: 'text/plain' });\n};\nconst apiOnly = await resolveSite('https://api-only.example/', { fetchImpl: apiOnlyFetch, resolveImpl: PUBLIC_DNS, timeoutMs: 1000, maxBytes: 128 * 1024 });\nassert.equal(planResolvedSite(apiOnly, 'structured').selected.url, 'https://api-only.example/openapi.json');\nassert.equal(planResolvedSite(apiOnly, 'search').selected, null);\n\nawait assert.rejects'''
          if marker not in text:
              raise SystemExit('resolver test marker not found')
          test.write_text(text.replace(marker, insertion, 1), encoding='utf-8')

          diag = Path('benchmarks/selection-diagnostics.mjs')
          text = diag.read_text(encoding='utf-8')
          old = '''export function buildSelectionDiagnostics(report, strategy = DEFAULT_STRATEGY) {\n  if (!report || !Array.isArray(report.results)) throw new Error('Benchmark report must contain results[].');\n  const issues = [];\n  const siteRows = [];\n  let total = 0;\n  let correct = 0;\n'''
          new = '''export function buildSelectionDiagnostics(report, strategy = DEFAULT_STRATEGY) {\n  if (!report || !Array.isArray(report.results)) throw new Error('Benchmark report must contain results[].');\n  const issues = [];\n  const siteRows = [];\n  const regretCases = [];\n  const uniquelyCorrectCases = [];\n  const simplerStrategies = ['ordinary-web', 'llms-aware', 'agents-aware', 'protocol-native', 'arwp-profile-only'];\n  let total = 0;\n  let correct = 0;\n'''
          if old not in text:
              raise SystemExit('diagnostics header marker not found')
          text = text.replace(old, new, 1)

          old = '''        if (result.correct) {\n          correct += 1;\n          siteCorrect += 1;\n          continue;\n        }\n        const issue = {'''
          new = '''        const simplerCorrect = simplerStrategies.filter(name => site.strategyResults?.[name]?.intents?.[intent]?.correct);\n        if (strategy === 'resolver-union') {\n          if (!result.correct && simplerCorrect.length) {\n            regretCases.push({ siteId: site.id, intent, simplerStrategies: simplerCorrect });\n          }\n          if (result.correct && simplerCorrect.length === 0) {\n            uniquelyCorrectCases.push({ siteId: site.id, intent });\n          }\n        }\n        if (result.correct) {\n          correct += 1;\n          siteCorrect += 1;\n          continue;\n        }\n        const issue = {'''
          if old not in text:
              raise SystemExit('diagnostics result marker not found')
          text = text.replace(old, new, 1)

          old = '''      byCategory: countBy(issues, item => item.category),\n      byIntent: countBy(issues, item => item.intent)\n    },\n    weakSites,\n    issues\n'''
          new = '''      byCategory: countBy(issues, item => item.category),\n      byIntent: countBy(issues, item => item.intent),\n      resolverRegret: regretCases.length,\n      regretByIntent: countBy(regretCases, item => item.intent),\n      regretBySimplerStrategy: countBy(\n        regretCases.flatMap(item => item.simplerStrategies.map(name => ({ name }))),\n        item => item.name\n      ),\n      resolverUniquelyCorrect: uniquelyCorrectCases.length,\n      uniquelyCorrectByIntent: countBy(uniquelyCorrectCases, item => item.intent)\n    },\n    regretCases,\n    uniquelyCorrectCases,\n    weakSites,\n    issues\n'''
          if old not in text:
              raise SystemExit('diagnostics summary marker not found')
          diag.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run deterministic resolver and benchmark tests
        run: |
          node scripts/resolver-test.mjs
          node benchmarks/resolver-regret-test.mjs
          npm run test:benchmark
      - name: Run unchanged independent external corpus
        run: |
          mkdir -p /tmp/arwp-r4
          npm run benchmark:external -- --output=/tmp/arwp-r4/external.json
          node benchmarks/publication-report.mjs --input=/tmp/arwp-r4/external.json --output=/tmp/arwp-r4/external-public.json
          node benchmarks/selection-diagnostics.mjs --input=/tmp/arwp-r4/external-public.json --output=/tmp/arwp-r4/diagnostics.json
      - name: Record measured decision-quality result
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/arwp-r4/external.json', 'utf8'));
          const diagnostics = JSON.parse(fs.readFileSync('/tmp/arwp-r4/diagnostics.json', 'utf8'));
          const union = report.aggregate['resolver-union'];
          const llms = report.aggregate['llms-aware'];
          if (report.independentSites !== 20 || union.total !== 100 || llms.total !== 100) {
            throw new Error(`Frozen corpus shape changed: sites=${report.independentSites}, unionTotal=${union.total}, llmsTotal=${llms.total}`);
          }
          const lines = [
            '# R4 — generic OpenAPI search eligibility',
            '',
            'Date: 2026-08-28',
            '',
            '## Change',
            '',
            'Generic OpenAPI/API-description evidence is no longer treated as a search interface. Search selection now requires explicit search/retrieval semantics already represented by the resolver adapters.',
            '',
            'Ground truth and the reviewed 20-site corpus were not edited.',
            '',
            '## Frozen-corpus result',
            '',
            '| Strategy | Correct / 100 |',
            '| --- | ---: |',
            `| llms-aware | ${llms.correct} |`,
            `| resolver-union | ${union.correct} |`,
            '',
            `Resolver-union mismatches: ${diagnostics.summary.incorrect}.`,
            `Over-selection: ${diagnostics.summary.byCategory['over-selection'] || 0}.`,
            `Discovery gaps: ${diagnostics.summary.byCategory['discovery-gap'] || 0}.`,
            `Selection gaps: ${diagnostics.summary.byCategory['selection-gap'] || 0}.`,
            `Resolution failures: ${diagnostics.summary.byCategory['resolution-failure'] || 0}.`,
            `Resolver regret: ${diagnostics.summary.resolverRegret}.`,
            `Resolver uniquely correct: ${diagnostics.summary.resolverUniquelyCorrect}.`,
            '',
            '## Gate',
            '',
            'This is an eligibility correction, not permission to make resolver-union the default strategy. The union remains experimental until it demonstrably reduces regret and matches or exceeds the simpler best strategy on unchanged reviewed evidence.',
            '',
            '> External HTTP liveness can change between runs. Aggregate scores remain comparable only when the frozen corpus shape is intact; detailed URLs stay in workflow artifacts rather than this committed summary.'
          ];
          fs.mkdirSync('benchmarks/results', { recursive: true });
          fs.writeFileSync('benchmarks/results/2026-08-28-r4-openapi-search-eligibility.md', `${lines.join('\n')}\n`);
          console.log(lines.join('\n'));
          NODE
      - name: Commit verified R4 slice
        run: |
          rm .github/workflows/r4-openapi-search-eligibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stop treating generic OpenAPI as search evidence"
          git push origin HEAD:r4-resolver-dominance
