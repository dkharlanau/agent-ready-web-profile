name: ARWP Growth Learning

on:
  push:
    branches: [main]
    paths:
      - 'lib/visibility-evidence.mjs'
      - 'lib/visibility-import.mjs'
      - 'bin/arwp-visibility.mjs'
      - 'schema/visibility-snapshot.schema.json'
      - 'scripts/visibility-evidence-test.mjs'
      - 'scripts/visibility-import-test.mjs'
      - 'registry/trends.json'
      - 'registry/trend-watch-sources.json'
      - 'lib/trend-radar.mjs'
      - 'lib/trend-source-watch.mjs'
      - 'lib/trend-promotion.mjs'
      - 'bin/arwp-trend-promotion.mjs'
      - 'schema/trend-promotion-proposal.schema.json'
      - 'scripts/trend-promotion-test.mjs'
      - 'lib/trend-measurement.mjs'
      - 'schema/trend-measurement-evidence.schema.json'
      - 'scripts/trend-measurement-test.mjs'
      - 'bin/arwp-trends.mjs'
      - '.github/workflows/growth-learning.yml'
  pull_request:
    paths:
      - 'lib/visibility-evidence.mjs'
      - 'lib/visibility-import.mjs'
      - 'bin/arwp-visibility.mjs'
      - 'schema/visibility-snapshot.schema.json'
      - 'scripts/visibility-evidence-test.mjs'
      - 'scripts/visibility-import-test.mjs'
      - 'registry/trends.json'
      - 'registry/trend-watch-sources.json'
      - 'lib/trend-radar.mjs'
      - 'lib/trend-source-watch.mjs'
      - 'lib/trend-promotion.mjs'
      - 'bin/arwp-trend-promotion.mjs'
      - 'schema/trend-promotion-proposal.schema.json'
      - 'scripts/trend-promotion-test.mjs'
      - 'lib/trend-measurement.mjs'
      - 'schema/trend-measurement-evidence.schema.json'
      - 'scripts/trend-measurement-test.mjs'
      - 'bin/arwp-trends.mjs'
      - '.github/workflows/growth-learning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  growth-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate owner visibility evidence and imports
        run: |
          node scripts/visibility-evidence-test.mjs
          node scripts/visibility-import-test.mjs
          node --check lib/visibility-evidence.mjs
          node --check lib/visibility-import.mjs
          node --check bin/arwp-visibility.mjs
          node --check scripts/visibility-import-test.mjs
          node bin/arwp-visibility.mjs --help | grep -q 'arwp-visibility import'
      - name: Validate reviewable Trend promotion proposals
        run: |
          node scripts/trend-promotion-test.mjs
          node --check lib/trend-promotion.mjs
          node --check bin/arwp-trend-promotion.mjs
          node --check scripts/trend-promotion-test.mjs
          node bin/arwp-trends.mjs --help | grep -q 'WATCH -> ADOPT'
          node bin/arwp-trends.mjs --help | grep -q 'propose <source-watch.json>'
      - name: Validate Trend MEASURED evidence gate
        run: |
          node scripts/trend-measurement-test.mjs
          node --check lib/trend-measurement.mjs
          node --check scripts/trend-measurement-test.mjs
          node --check bin/arwp-trends.mjs
          node bin/arwp-trends.mjs --help | grep -q 'measure <experiment.json|experiment-directory>'
          grep -q 'noAutomaticMeasuredPromotion' schema/trend-measurement-evidence.schema.json
          grep -q 'negativeAndNeutralResultsIncluded' schema/trend-measurement-evidence.schema.json
          grep -q 'measuredMeansObservedNotPositive' schema/trend-measurement-evidence.schema.json
      - name: Guard against silent promotion
        run: |
          grep -q 'approvalDoesNotMutateRegistry' schema/trend-promotion-proposal.schema.json
          grep -q 'noAutomaticAdoptPromotion' registry/trend-watch-sources.json
          grep -q 'trendIds' registry/trend-watch-sources.json
