name: ARWP Growth Owner Data

on:
  push:
    branches: [main]
    paths:
      - 'lib/growth-owner-data.mjs'
      - 'lib/growth-plan.mjs'
      - 'schema/growth-owner-data.schema.json'
      - 'templates/growth/owner-data.json'
      - 'scripts/growth-owner-data-test.mjs'
      - 'docs/GROWTH-OWNER-DATA.md'
      - '.github/workflows/growth-owner-data.yml'
  pull_request:
    paths:
      - 'lib/growth-owner-data.mjs'
      - 'lib/growth-plan.mjs'
      - 'schema/growth-owner-data.schema.json'
      - 'templates/growth/owner-data.json'
      - 'scripts/growth-owner-data-test.mjs'
      - 'docs/GROWTH-OWNER-DATA.md'
      - '.github/workflows/growth-owner-data.yml'

permissions:
  contents: read

jobs:
  owner-data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate owner-data isolation and Growth compatibility
        run: |
          node scripts/growth-owner-data-test.mjs
          node scripts/growth-profile-test.mjs
          node --check lib/growth-owner-data.mjs
          node --check lib/growth-plan.mjs
          node --check scripts/growth-owner-data-test.mjs
          node -e "JSON.parse(require('fs').readFileSync('schema/growth-owner-data.schema.json','utf8')); JSON.parse(require('fs').readFileSync('templates/growth/owner-data.json','utf8'));"
