name: One-shot homepage Growth metadata sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-homepage-growth-metadata.mjs'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Patch homepage entity metadata deterministically
        run: node scripts/sync-homepage-growth-metadata.mjs
      - name: Validate inserted JSON-LD
        run: |
          grep -q 'arwp-growth-entity-identity' docs/index.html
          grep -q 'application/ld+json' docs/index.html
          grep -q './growth/profile.json' docs/index.html
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('docs/index.html','utf8');
          const m=html.match(/<script type="application\/ld\+json" id="arwp-growth-entity-identity">([\s\S]*?)<\/script>/);
          if(!m) process.exit(1);
          const graph=JSON.parse(m[1]);
          const nodes=graph['@graph'] || [];
          if(!nodes.some(n => n['@type']==='Person' && n.name==='Dzmitryi Kharlanau')) process.exit(1);
          if(!nodes.some(n => Array.isArray(n['@type']) && n['@type'].includes('SoftwareApplication'))) process.exit(1);
          if(!nodes.some(n => n['@type']==='WebSite')) process.exit(1);
          NODE
      - name: Commit homepage metadata
        run: |
          if git diff --quiet -- docs/index.html; then
            echo 'Homepage metadata already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Publish canonical homepage entity identity metadata'
          git push origin HEAD:main
