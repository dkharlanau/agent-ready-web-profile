name: ARWP managed website growth issue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  issues: write

env:
  # Replace with the public canonical URL for this repository/site.
  ARWP_GROWTH_URL: https://example.com/
  # Optional: pin the managed issue after the first run to avoid discovery ambiguity.
  ARWP_ISSUE_NUMBER: ''
  ARWP_ISSUE_TITLE: 'ARWP website growth backlog'
  # Commit reviewed Growth Experiment JSON records here if you want the managed issue
  # to surface implementation / measurement / review follow-up. ARWP never writes this directory.
  ARWP_EXPERIMENT_DIR: .arwp-evidence/growth/experiments

jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install ARWP package without modifying the repository
        run: |
          npm pack dkharlanau/agent-ready-web-profile --pack-destination "$RUNNER_TEMP" >/tmp/arwp-pack-name.txt
          ARWP_TGZ="$RUNNER_TEMP/$(tail -n1 /tmp/arwp-pack-name.txt)"
          mkdir -p .arwp
          tar -xzf "$ARWP_TGZ" -C .arwp --strip-components=1
          (cd .arwp && npm install --ignore-scripts --no-audit --no-fund --omit=dev)

      - name: Build current Growth plan and snapshot
        run: |
          node .arwp/bin/arwp-growth.mjs "$ARWP_GROWTH_URL" --json > arwp-growth.json
          OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node .arwp/bin/arwp-growth-history.mjs snapshot arwp-growth.json --observed-at="$OBSERVED_AT" --output=current.growth.snapshot.json

      - name: Recover previous snapshot from managed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > previous.growth.snapshot.json
          if [ -n "$ARWP_ISSUE_NUMBER" ]; then
            BODY="$(gh issue view "$ARWP_ISSUE_NUMBER" --json body --jq .body 2>/dev/null || true)"
          else
            gh issue list --state open --search "$ARWP_ISSUE_TITLE in:title" --json number,title,body --limit 20 > managed-issues.json
            BODY="$(
              ARWP_ISSUE_TITLE="$ARWP_ISSUE_TITLE" node - <<'NODE'
          const fs = require('fs');
          const issues = JSON.parse(fs.readFileSync('managed-issues.json', 'utf8'));
          const match = issues.find(issue => issue.title === process.env.ARWP_ISSUE_TITLE);
          if (match?.body) process.stdout.write(match.body);
          NODE
            )"
          fi
          BODY="$BODY" node - <<'NODE'
          const fs = require('fs');
          const body = process.env.BODY || '';
          const match = body.match(/<!-- arwp-growth-snapshot-base64:([A-Za-z0-9+/=]+) -->/);
          if (!match) process.exit(0);
          try {
            const decoded = Buffer.from(match[1], 'base64').toString('utf8');
            const parsed = JSON.parse(decoded);
            fs.writeFileSync('previous.growth.snapshot.json', JSON.stringify(parsed, null, 2) + '\n');
          } catch {}
          NODE
          if [ ! -s previous.growth.snapshot.json ]; then
            rm -f previous.growth.snapshot.json
          fi

      - name: Calculate implementation-state diff
        run: |
          if [ -f previous.growth.snapshot.json ]; then
            node .arwp/bin/arwp-growth-history.mjs diff previous.growth.snapshot.json current.growth.snapshot.json --json > growth-diff.json || true
          else
            printf '%s\n' '{"firstObservation":true}' > growth-diff.json
          fi

      - name: Inspect persistent Growth experiment ledger
        run: |
          CANONICAL_URL="$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('arwp-growth.json','utf8')).canonicalUrl)")"
          node .arwp/bin/arwp-growth-experiment.mjs status "$ARWP_EXPERIMENT_DIR" --site="$CANONICAL_URL" --json > arwp-experiment-status.json || true
          if [ ! -s arwp-experiment-status.json ]; then
            printf '%s\n' '{"version":"0.1","summary":{"total":0,"attentionRequired":0,"invalid":1},"attention":[],"invalid":[{"error":"experiment ledger status could not be generated"}]}' > arwp-experiment-status.json
          fi

      - name: Build issue body
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('arwp-growth.json','utf8'));
          const snapshot = JSON.parse(fs.readFileSync('current.growth.snapshot.json','utf8'));
          const diff = JSON.parse(fs.readFileSync('growth-diff.json','utf8'));
          const experiments = JSON.parse(fs.readFileSync('arwp-experiment-status.json','utf8'));
          const high = (p.actions || []).filter(a => a.priority === 'P0' || a.priority === 'P1');
          const optional = (p.actions || []).filter(a => a.priority === 'P2' || a.priority === 'P3');
          const lines = [
            '<!-- arwp-growth-managed -->',
            '# ARWP website growth backlog',
            '',
            `Target: ${p.canonicalUrl}`,
            `Growth Profile: ${p.profile}`,
            `Observation: ${snapshot.observedAt}`,
            `Snapshot: \`${snapshot.snapshotId}\``,
            '',
            '> This is a prioritized implementation backlog, not a ranking/readiness score. Fewer actions means less observed implementation debt; it does not prove better rankings, citations or recommendations.',
            ''
          ];
          lines.push('## Change since previous run', '');
          if (diff.firstObservation) {
            lines.push('First managed observation. The next run will report resolved/new/changed actions.', '');
          } else {
            lines.push(`High-priority debt: **${diff.before.debt.highPriority} → ${diff.after.debt.highPriority}** (${diff.summary.highPriorityDebtDelta >= 0 ? '+' : ''}${diff.summary.highPriorityDebtDelta})`, '');
            if (diff.resolved?.length) {
              lines.push(`Resolved since previous run (${diff.resolved.length}):`);
              for (const item of diff.resolved) lines.push(`- ✅ **${item.priority}** ${item.title || item.id}`);
              lines.push('');
            }
            if (diff.added?.length) {
              lines.push(`New since previous run (${diff.added.length}):`);
              for (const item of diff.added) lines.push(`- ⚠️ **${item.priority}** ${item.title || item.id}`);
              lines.push('');
            }
            if (diff.changed?.length) {
              lines.push(`Changed since previous run (${diff.changed.length}):`);
              for (const item of diff.changed) lines.push(`- **${item.id}** — ${Object.keys(item.changes || {}).join(', ')}`);
              lines.push('');
            }
            if (!diff.resolved?.length && !diff.added?.length && !diff.changed?.length) lines.push('No Growth action-set changes since the previous observation.', '');
          }

          lines.push('## Experiment follow-up', '');
          const s = experiments.summary || {};
          lines.push(`Persistent experiment records: **${s.total || 0}** · awaiting implementation: **${s.awaitingImplementation || 0}** · measurement: **${s.awaitingMeasurement || 0}** · review: **${s.awaitingReview || 0}**`, '');
          if (experiments.attention?.length) {
            for (const item of experiments.attention) {
              const state = item.attention === 'awaiting-implementation' ? 'implement' : item.attention === 'awaiting-measurement' ? 'measure' : 'review';
              lines.push(`- **${state.toUpperCase()}** \`${item.id}\` — hypothesis \`${item.hypothesisId}\`; actions: ${(item.actionIds || []).map(id => `\`${id}\``).join(', ')}`);
            }
            lines.push('');
          } else {
            lines.push('No Growth experiments currently require implementation, measurement or human review.', '');
          }
          if (experiments.invalid?.length) {
            lines.push(`Invalid experiment evidence records (${experiments.invalid.length}) must be fixed before they can enter the learning loop:`, '');
            for (const item of experiments.invalid) lines.push(`- \`${item.file || 'unknown file'}\`${item.id ? ` / \`${item.id}\`` : ''}: ${item.error}`);
            lines.push('');
          }

          lines.push(`## Current P0/P1 actions (${high.length})`, '');
          if (!high.length) lines.push('No current P0/P1 actions from the public-site Growth Profile.', '');
          for (const a of high) {
            lines.push(`### ${a.priority} · ${a.title}`, '', a.reason || '', '');
            if (a.implementation?.file) lines.push(`Suggested file/template: \`${a.implementation.file}\``, '');
            if (a.implementation?.url) lines.push(`Suggested URL: ${a.implementation.url}`, '');
            if (a.source) lines.push(`Primary guidance: ${a.source}`, '');
          }
          lines.push(`## P2/P3 opportunities (${optional.length})`, '');
          for (const a of optional) lines.push(`- **${a.priority}** ${a.title}${a.source ? ` — ${a.source}` : ''}`);
          lines.push('', '## Evidence boundary', '', 'Public crawling can observe implementation state but cannot see authenticated Google/Bing owner metrics or prove that a platform will recommend the site. Outcome evidence must be measured separately. Experiment records are read from the repository and never modified by this workflow.');
          const encoded = Buffer.from(JSON.stringify(snapshot), 'utf8').toString('base64');
          lines.push('', `<!-- arwp-growth-snapshot-base64:${encoded} -->`);
          fs.writeFileSync('arwp-growth-issue.md', lines.join('\n') + '\n');
          NODE

      - name: Create or update one managed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$ARWP_ISSUE_NUMBER" ]; then
            gh issue edit "$ARWP_ISSUE_NUMBER" --body-file arwp-growth-issue.md
          else
            gh issue list --state open --search "$ARWP_ISSUE_TITLE in:title" --json number,title --limit 20 > managed-issues.json
            ISSUE_NUMBER="$(
              ARWP_ISSUE_TITLE="$ARWP_ISSUE_TITLE" node - <<'NODE'
          const fs = require('fs');
          const issues = JSON.parse(fs.readFileSync('managed-issues.json', 'utf8'));
          const match = issues.find(issue => issue.title === process.env.ARWP_ISSUE_TITLE);
          if (match?.number != null) process.stdout.write(String(match.number));
          NODE
            )"
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" --body-file arwp-growth-issue.md
            else
              gh issue create --title "$ARWP_ISSUE_TITLE" --body-file arwp-growth-issue.md
            fi
          fi

      - name: Upload machine-readable Growth evidence
        uses: actions/upload-artifact@v6
        with:
          name: arwp-growth-profile
          path: |
            arwp-growth.json
            current.growth.snapshot.json
            growth-diff.json
            arwp-experiment-status.json
          if-no-files-found: error
          retention-days: 30
