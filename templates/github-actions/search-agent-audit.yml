name: ARWP Search and Agent audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    if: ${{ vars.ARWP_SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARWP
        uses: actions/checkout@v7
        with:
          repository: dkharlanau/agent-ready-web-profile
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit configured site
        env:
          ARWP_SITE_URL: ${{ vars.ARWP_SITE_URL }}
        run: |
          set +e
          node bin/arwp.mjs audit "$ARWP_SITE_URL" --json > arwp-search-agent-audit.json
          code=$?
          set -e
          cat arwp-search-agent-audit.json
          exit "$code"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arwp-search-agent-audit
          path: arwp-search-agent-audit.json
          if-no-files-found: warn
          retention-days: 30

# Configure repository variable ARWP_SITE_URL with the canonical public HTTPS site URL.
# The audit fails only on observable hard failures; warnings, watch items and not-assessed
# checks remain visible without being converted into a generic readiness score.
